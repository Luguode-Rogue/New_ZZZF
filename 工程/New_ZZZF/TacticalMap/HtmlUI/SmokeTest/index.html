<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BannerlordHtmlUI Display Smoke Test</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .panel {
      width: min(720px, 70vw);
      padding: 34px 42px;
      border: 2px solid rgba(222, 186, 104, 0.95);
      border-radius: 16px;
      background: rgba(18, 16, 13, 0.94);
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.55);
      text-align: center;
    }

    .title {
      color: #f3d796;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .status {
      margin-top: 16px;
      color: #8fe3a8;
      font-size: 18px;
    }

    .detail {
      margin-top: 12px;
      color: #c8c0b4;
      font-size: 14px;
      line-height: 1.8;
    }

    .pulse {
      width: 12px;
      height: 12px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #7ee59b;
      box-shadow: 0 0 18px rgba(126, 229, 155, 0.75);
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="pulse"></div>
    <div class="title">HTMLUI DISPLAY TEST</div>
    <div class="status">BannerlordHtmlUI 已成功呈现此页面</div>
    <div class="detail">
      本页面不连接 TacticalMap、Mission、Controller、State、Command、Request 或任何游戏输入。<br>
      此测试只验证 ContentRoot → Page → Navigate → WebView2 → Overlay 的基础显示链。
    </div>
  </div>
</body>
</html>
