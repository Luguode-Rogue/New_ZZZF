<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TacticalMap HtmlUI</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#ece4d4;background:transparent}
*{box-sizing:border-box}
body{margin:0;background:transparent;overflow:hidden}
#panel{position:fixed;top:28px;right:28px;width:390px;padding:12px;border:1px solid rgba(212,174,92,.75);border-radius:10px;background:linear-gradient(180deg,rgba(11,14,18,.97),rgba(18,20,21,.95));box-shadow:0 12px 34px rgba(0,0,0,.45);backdrop-filter:blur(5px)}
#head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#title{font-size:17px;letter-spacing:1px;font-weight:700;color:#f0d59d}
#status{font-size:11px;color:#8e9aa3}
#mapWrap{position:relative;border:1px solid rgba(220,202,168,.45);border-radius:8px;overflow:hidden;background:#10150f}
#map{display:block;width:100%;height:auto;aspect-ratio:1/1;image-rendering:auto}
#hud{position:absolute;inset:0;pointer-events:none}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:#b9b1a5}
.legend span{display:inline-flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;display:inline-block}
.dot.player{border:1px solid #54d8ff;border-radius:50%;background:#ffd84a}
.dot.friend{background:#6be48a}
.dot.enemy{background:#ff5a5a}
.dot.cam{width:8px;height:8px;background:#ffab2f;transform:rotate(45deg)}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:9px}
button{border:1px solid rgba(220,202,168,.35);border-radius:6px;padding:7px 8px;background:#1d2327;color:#e5dac6;font-size:12px;cursor:pointer}
button:hover{background:#2a3238;border-color:rgba(220,202,168,.65)}
button.active{background:#51401e;border-color:#d6ad58;color:#ffe5a7}
#foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:#8e969d}
#mode{color:#d5b36e}
</style>
</head>
<body>
<div id="panel">
  <div id="head">
    <div id="title">TACTICAL MAP</div>
    <div id="status">同步中</div>
  </div>
  <div id="mapWrap">
    <canvas id="map" width="640" height="640"></canvas>
    <div id="hud"></div>
  </div>
  <div class="legend">
    <span><i class="dot player"></i>玩家</span>
    <span><i class="dot friend"></i>友军编队</span>
    <span><i class="dot enemy"></i>敌军编队</span>
    <span><i class="dot cam"></i>镜头</span>
  </div>
  <div class="controls">
    <button id="move" class="active">左键：移动</button>
    <button id="attack">Shift：攻击移动</button>
    <button id="face">右键：朝向</button>
    <button id="camera">镜头联动：开</button>
    <button id="risk">危险层：开</button>
    <button id="refresh">刷新地图</button>
  </div>
  <div class="controls">
    <button id="capture">捕获输入</button>
    <button id="release">释放输入</button>
    <button id="close">关闭新 UI</button>
  </div>
  <div id="foot"><span id="mode">指令：移动</span><span id="count">编队 0</span></div>
</div>
<script>
const app=window.game.app;
const canvas=document.getElementById('map');
const ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status');
const modeEl=document.getElementById('mode');
const countEl=document.getElementById('count');
let mapState=null;
let staticState=null;
let mode='move';
let riskEnabled=true;
let cameraLink=true;
let baseImage=null;
let riskImage=null;
let started=false;

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function setMode(next){
  mode=next;
  modeEl.textContent='指令：'+(mode==='move'?'移动':mode==='attack'?'攻击移动':'朝向');
  document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));
  document.getElementById(mode==='move'?'move':mode==='attack'?'attack':'face').classList.add('active');
}
function rgbaToImage(data){
  if(!data||!data.ready)return null;
  const bytes=Uint8Array.from(atob(data),c=>c.charCodeAt(0));
  const imageData=new ImageData(new Uint8ClampedArray(bytes.buffer),160,160);
  const off=document.createElement('canvas');off.width=160;off.height=160;
  off.getContext('2d').putImageData(imageData,0,0);
  return off;
}
function rebuildImages(){
  baseImage=rgbaToImage(staticState?.terrainRgba?{ready:true, ...staticState}:null);
  if(staticState?.riskRgba){
    const bytes=Uint8Array.from(atob(staticState.riskRgba),c=>c.charCodeAt(0));
    const imageData=new ImageData(new Uint8ClampedArray(bytes.buffer),160,160);
    const off=document.createElement('canvas');off.width=160;off.height=160;
    off.getContext('2d').putImageData(imageData,0,0);
    riskImage=off;
  } else riskImage=null;
}
function drawMarker(x,y,color,size=7){
  ctx.fillStyle=color;ctx.fillRect(x-size/2,y-size/2,size,size);
}
function drawMap(){
  const w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  if(baseImage){ctx.drawImage(baseImage,0,0,w,h)}else{ctx.fillStyle='#162016';ctx.fillRect(0,0,w,h)}
  if(riskEnabled&&riskImage){ctx.globalAlpha=.36;ctx.drawImage(riskImage,0,0,w,h);ctx.globalAlpha=1}
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;
  for(let i=1;i<4;i++){let p=i*w/4;ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,h);ctx.stroke();ctx.beginPath();ctx.moveTo(0,p);ctx.lineTo(w,p);ctx.stroke()}
  for(const f of (mapState?.formations||[])){
    const x=f.uvx*w,y=f.uvy*h;
    const fill=f.Color?('#'+(f.Color>>>8).toString(16).padStart(6,'0')):(f.enemy?'#b33':'#355');
    ctx.fillStyle=fill;ctx.fillRect(x-6,y-6,12,12);
    ctx.strokeStyle=f.player?'#fff':(f.enemy?'#e54b4b':'#55d57d');ctx.lineWidth=2;ctx.strokeRect(x-7,y-7,14,14);
    if(Math.abs(f.fx)>0.01||Math.abs(f.fy)>0.01){ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+f.fx*15,y+f.fy*15);ctx.stroke()}
    if(f.count){ctx.fillStyle='#fff';ctx.font='10px Segoe UI';ctx.fillText(String(f.count),x+8,y-7)}
  }
  if(mapState?.player){
    const x=mapState.player.uvx*w,y=mapState.player.uvy*h;
    ctx.strokeStyle='#54d8ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#ffd84a';ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
  }
  if(mapState?.camera){
    const x=mapState.camera.uvx*w,y=mapState.camera.uvy*h;
    ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.fillStyle='#ffab2f';ctx.fillRect(-6,-6,12,12);ctx.restore();
  }
}
function applyMapState(v){
  mapState=v||null;
  countEl.textContent='编队 '+((mapState?.formations||[]).length);
  cameraLink=!!mapState?.cameraLink;
  document.getElementById('camera').classList.toggle('active',cameraLink);
  statusEl.textContent=mapState?'实时':'等待数据';
  drawMap();
}
app.state.subscribe('map',applyMapState);
app.state.subscribe('mapStatic',v=>{staticState=v;if(v?.ready){rebuildImages();drawMap()}});

document.getElementById('move').onclick=()=>setMode('move');
document.getElementById('attack').onclick=()=>setMode('attack');
document.getElementById('face').onclick=()=>setMode('face');
document.getElementById('camera').onclick=async()=>{cameraLink=!cameraLink;await app.call('setCameraLink',{enabled:cameraLink})};
document.getElementById('risk').onclick=()=>{riskEnabled=!riskEnabled;document.getElementById('risk').textContent='危险层：'+(riskEnabled?'开':'关');drawMap()};
document.getElementById('refresh').onclick=()=>app.call('refresh',{});
document.getElementById('capture').onclick=()=>game.input.capture();
document.getElementById('release').onclick=()=>game.input.release();
document.getElementById('close').onclick=()=>app.call('close',{});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();
  const u=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  const v=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
  app.call('mapClick',{u,v,mode});
});

(async()=>{
  try{
    staticState=await app.request('getMapData');
    if(staticState?.ready)rebuildImages();
    started=true;statusEl.textContent='已连接';
    drawMap();
  }catch(e){statusEl.textContent='桥接失败';console.error(e)}
})();
</script>
</body>
</html>
