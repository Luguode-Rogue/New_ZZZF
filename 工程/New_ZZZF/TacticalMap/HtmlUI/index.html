<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TacticalMap HtmlUI</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#ece4d4;background:transparent}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}
body{pointer-events:none}
button{font:inherit}
#app{position:fixed;inset:0;pointer-events:none}
#panel{position:fixed;right:24px;bottom:24px;width:390px;padding:12px;border:1px solid rgba(212,174,92,.78);border-radius:10px;background:linear-gradient(180deg,rgba(11,14,18,.96),rgba(18,20,21,.93));box-shadow:0 12px 34px rgba(0,0,0,.46);backdrop-filter:blur(5px);pointer-events:none;transition:all .16s ease}
#app.interactive #panel{pointer-events:auto}
#app.full #panel{top:18px;left:18px;right:18px;bottom:18px;width:auto;height:auto;padding:14px;display:grid;grid-template-columns:210px minmax(0,1fr) 230px;grid-template-rows:40px minmax(0,1fr) 42px;gap:10px}
#app.full #head{grid-column:1 / 4;grid-row:1}
#app.full #sideLeft{grid-column:1;grid-row:2}
#app.full #mapWrap{grid-column:2;grid-row:2}
#app.full #sideRight{grid-column:3;grid-row:2}
#app.full #foot{grid-column:1 / 4;grid-row:3}
#app.full .compactLegend{display:none}
#app.full .fullOnly{display:block}
.fullOnly{display:none}
#head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#title{font-size:17px;letter-spacing:1px;font-weight:700;color:#f0d59d}
#status{font-size:11px;color:#8e9aa3}
#mapWrap{position:relative;border:1px solid rgba(220,202,168,.45);border-radius:8px;overflow:hidden;background:#10150f;min-height:0}
#map{display:block;width:100%;height:100%;image-rendering:auto;pointer-events:none}
#app.interactive #map{pointer-events:auto;cursor:crosshair}
.compactMap{aspect-ratio:1/1}
#app.full .compactMap{aspect-ratio:auto}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:#b9b1a5}
.legend span{display:inline-flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;display:inline-block}
.dot.player{border:1px solid #54d8ff;border-radius:50%;background:#ffd84a}
.dot.friend{background:#6be48a}
.dot.enemy{background:#ff5a5a;transform:rotate(45deg)}
.dot.cam{width:8px;height:8px;background:#ffab2f;transform:rotate(45deg)}
.controls{display:none}
#foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:#8e969d;gap:12px}
#mode{color:#d5b36e}
#hint{color:#8e969d;text-align:right}
#sideLeft,#sideRight{display:none;min-height:0;overflow:auto;border:1px solid rgba(220,202,168,.18);border-radius:8px;padding:10px;background:rgba(8,10,12,.34)}
#app.full #sideLeft,#app.full #sideRight{display:block}
.sideTitle{font-size:12px;color:#e6d4ad;font-weight:700;margin-bottom:8px}
.formation{padding:8px;border:1px solid rgba(220,202,168,.16);border-radius:7px;margin-bottom:6px;background:rgba(255,255,255,.025);cursor:pointer}
.formation:hover{background:rgba(255,255,255,.06)}
.formation.selected{border-color:rgba(212,174,92,.8);background:rgba(81,64,30,.28)}
.formation .name{font-size:12px;color:#f0eadf}
.formation .meta{font-size:10px;color:#8e969d;margin-top:3px}
#selectedDetail{font-size:11px;line-height:1.65;color:#c9c1b5}
#selectedDetail strong{color:#f0d59d}
#app.passive #hint{content:"N 短按：进入地图操作"}
#app.interactive #hint{content:"左键：移动 · 中键：镜头 · 右键：朝向 · ESC：退出操作"}
#app.full.passive #hint{content:"N 短按：进入地图操作 · N 长按：隐藏"}
#app.full.interactive #hint{content:"左键：移动 · 中键：镜头 · 右键：朝向 · ESC：退出操作"}
</style>
</head>
<body>
<div id="app" class="passive">
  <div id="panel">
    <div id="head"><div id="title">TACTICAL MAP</div><div id="status">等待数据</div></div>
    <div id="sideLeft"><div class="sideTitle">编队</div><div id="formationList"></div></div>
    <div id="mapWrap" class="compactMap"><canvas id="map" width="640" height="640"></canvas></div>
    <div id="sideRight"><div class="sideTitle">选中编队</div><div id="selectedDetail">未选择编队</div></div>
    <div class="legend compactLegend"><span><i class="dot player"></i>玩家</span><span><i class="dot friend"></i>友军</span><span><i class="dot enemy"></i>敌军</span><span><i class="dot cam"></i>镜头</span></div>
    <div id="foot"><span id="mode">地图：小地图 · 观察</span><span id="hint">N 短按：进入地图操作</span></div>
  </div>
</div>
<script>
const app=window.game.app;
const canvas=document.getElementById('map');
const ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status');
const modeEl=document.getElementById('mode');
const hintEl=document.getElementById('hint');
const formationListEl=document.getElementById('formationList');
const selectedDetailEl=document.getElementById('selectedDetail');
let mapState=null,staticState=null,baseImage=null,riskImage=null,riskEnabled=true,selectedFormation=-1;
let issuedOrderLines=[];

function stateClass(v){
  const full=!!v?.fullscreen, interactive=!!v?.interactive;
  app.classList.toggle('full',full);
  app.classList.toggle('interactive',interactive);
  app.classList.toggle('passive',!interactive);
  document.getElementById('mapWrap').classList.toggle('compactMap',!full);
  if(!v?.visible){app.style.display='none';}else{app.style.display='block';}
  modeEl.textContent=!v?.visible?'地图：隐藏':full?(interactive?'地图：全屏 · 操作':'地图：全屏 · 观察'):(interactive?'地图：小地图 · 操作':'地图：小地图 · 观察');
  hintEl.textContent=!v?.visible?'':interactive?'左键：移动 · 中键：镜头 · 右键：朝向 · ESC：退出操作':full?'N 短按：进入地图操作 · N 长按：隐藏':'N 短按：进入地图操作';
}
function makeImage(b64,w,h){
  if(!b64)return null;
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const data=new ImageData(new Uint8ClampedArray(bytes.buffer),w,h);
  const off=document.createElement('canvas');off.width=w;off.height=h;
  off.getContext('2d').putImageData(data,0,0);return off;
}
function rebuildImages(){
  if(!staticState?.ready)return;
  baseImage=makeImage(staticState.terrainRgba,staticState.width,staticState.height);
  riskImage=makeImage(staticState.riskRgba,staticState.width,staticState.height);
}
function worldDistance(uvx,uvy){
  if(!mapState?.player||!staticState?.worldW||!staticState?.worldH)return Infinity;
  const dx=(uvx-mapState.player.uvx)*staticState.worldW;
  const dy=(uvy-mapState.player.uvy)*staticState.worldH;
  return Math.hypot(dx,dy);
}
function formationVisibleAtDistance(f){
  return worldDistance(f.uvx,f.uvy) > (mapState?.agentDetailDistance || 90);
}
function drawMarkerFormation(f,w,h){
  const x=f.uvx*w,y=f.uvy*h;
  const stroke=f.player?'#54d8ff':(f.enemy?'#ff5a5a':'#6be48a');
  const fill=f.player?'#1c6a84':(f.enemy?'#6f2424':'#235a37');
  ctx.fillStyle=fill;ctx.fillRect(x-7,y-7,14,14);
  ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.strokeRect(x-8,y-8,16,16);
  if(Math.abs(f.fx)>0.01||Math.abs(f.fy)>0.01){ctx.strokeStyle='#fff';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+f.fx*17,y+f.fy*17);ctx.stroke()}
  ctx.fillStyle='#fff';ctx.font='10px Segoe UI';ctx.fillText(String(f.index+1),x+9,y-8);
}
function drawAgent(a,w,h){
  const x=a.u*w,y=a.v*h;
  let c=a.neutral?'#b5b0a6':a.player?'#54d8ff':'#ff5555';
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,2.2,0,Math.PI*2);ctx.fill();
}
function drawPlayer(w,h){
  if(!mapState?.player)return;
  const x=mapState.player.uvx*w,y=mapState.player.uvy*h;
  ctx.strokeStyle='#54d8ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#ffd84a';ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill();
  const fx=mapState.player.fx,fy=mapState.player.fy;
  if(Math.abs(fx)>0.01||Math.abs(fy)>0.01){ctx.strokeStyle='#ffe8a0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+fx*18,y+fy*18);ctx.stroke()}
}
function drawCamera(w,h){
  if(!mapState?.camera)return;
  const x=mapState.camera.uvx*w,y=mapState.camera.uvy*h;ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.fillStyle='#ffab2f';ctx.fillRect(-6,-6,12,12);ctx.restore();
}
function drawOrderLines(w,h){
  ctx.lineWidth=2;
  for(const line of issuedOrderLines){
    ctx.strokeStyle=line.type==='face'?'rgba(255,220,130,.72)':'rgba(120,205,255,.64)';
    ctx.setLineDash(line.type==='face'?[5,4]:[]);
    ctx.beginPath();ctx.moveTo(line.from.u*w,line.from.v*h);ctx.lineTo(line.to.u*w,line.to.v*h);ctx.stroke();
    ctx.setLineDash([]);
  }
}
function drawMap(){
  const w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  if(baseImage)ctx.drawImage(baseImage,0,0,w,h);else{ctx.fillStyle='#162016';ctx.fillRect(0,0,w,h)}
  if(riskEnabled&&riskImage){ctx.globalAlpha=.30;ctx.drawImage(riskImage,0,0,w,h);ctx.globalAlpha=1}
  ctx.strokeStyle='rgba(255,255,255,.10)';ctx.lineWidth=1;
  for(let i=1;i<4;i++){const p=i*w/4;ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,h);ctx.stroke();ctx.beginPath();ctx.moveTo(0,p);ctx.lineTo(w,p);ctx.stroke()}
  const threshold=mapState?.agentDetailDistance||90;
  for(const f of(mapState?.formations||[])){if(formationVisibleAtDistance(f))drawMarkerFormation(f,w,h)}
  if(mapState?.player&&mapState?.agents){
    for(const a of mapState.agents){
      if(worldDistance(a.u,a.v)<=threshold)drawAgent(a,w,h);
    }
  }
  drawOrderLines(w,h);
  drawPlayer(w,h);drawCamera(w,h);
}
function renderFormations(){
  const list=mapState?.formations||[];formationListEl.innerHTML='';
  list.forEach((f,i)=>{
    const div=document.createElement('div');div.className='formation'+(i===selectedFormation?' selected':'');
    const side=f.player?'我方':f.enemy?'敌方':'中立';
    div.innerHTML='<div class="name">'+(i+1)+'. '+escapeHtml(f.Name||('编队 '+(i+1)))+'</div><div class="meta">'+side+' · '+String(f.count||0)+' 人</div>';
    div.onclick=()=>{selectedFormation=i;renderFormations();renderSelected();};formationListEl.appendChild(div);
  });
}
function renderSelected(){
  const list=mapState?.formations||[],f=list[selectedFormation];
  if(!f){selectedDetailEl.textContent='未选择编队';return}
  const side=f.player?'我方':f.enemy?'敌方':'中立';
  selectedDetailEl.innerHTML='<strong>'+(selectedFormation+1)+'. '+escapeHtml(f.Name||('编队 '+(selectedFormation+1)))+'</strong><br>阵营：'+side+'<br>人数：'+String(f.count||0)+'<br>位置：'+f.X.toFixed(1)+', '+f.y.toFixed(1)+'<br>朝向：'+f.fx.toFixed(2)+', '+f.fy.toFixed(2);
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function canvasUv(e){const r=canvas.getBoundingClientRect();return {u:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),v:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))}}
function pushOrderLine(u,v,type){
  if(!mapState?.player)return;
  issuedOrderLines.push({from:{u:mapState.player.uvx,v:mapState.player.uvy},to:{u,v},type});
  if(issuedOrderLines.length>8)issuedOrderLines.shift();
  drawMap();
}
function applyMapState(v){
  mapState=v||null;
  statusEl.textContent=v?'实时':'等待数据';
  stateClass(v);renderFormations();renderSelected();drawMap();
}
app.state.subscribe('map',applyMapState);
app.state.subscribe('mapStatic',v=>{staticState=v;if(v?.ready){rebuildImages();drawMap()}});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('click',e=>{
  if(!mapState?.interactive)return;
  const p=canvasUv(e);app.call('mapClick',{u:p.u,v:p.v,mode:'move'});pushOrderLine(p.u,p.v,'move');
});
canvas.addEventListener('auxclick',e=>{
  if(!mapState?.interactive)return;
  const p=canvasUv(e);
  if(e.button===1){e.preventDefault();app.call('cameraClick',{u:p.u,v:p.v});return}
  if(e.button===2){e.preventDefault();app.call('mapClick',{u:p.u,v:p.v,mode:'face'});pushOrderLine(p.u,p.v,'face')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mapState?.interactive){e.preventDefault();app.call('framework.setInputMode',{mode:'Passive'});}});
(async()=>{try{staticState=await app.request('getMapData');if(staticState?.ready)rebuildImages();drawMap()}catch(e){statusEl.textContent='桥接失败';console.error(e)}})();
</script>
</body>
</html>
