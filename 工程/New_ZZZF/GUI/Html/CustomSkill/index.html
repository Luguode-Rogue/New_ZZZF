<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZZZF 技能配置</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0a0907;--panel:#15120e;--panel2:#1b1711;--panel3:#241d14;
  --line:rgba(211,174,92,.28);--line2:rgba(211,174,92,.48);
  --gold:#e8c36e;--gold2:#f5dda5;--text:#eadfce;--muted:#9b9185;
  --danger:#d77d63;--ok:#8baa7d;--blue:#829dbd;
  font-family:"Segoe UI","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--text)}
body{position:relative;user-select:none}
button,input,textarea{font:inherit}
button{border:1px solid var(--line);border-radius:7px;background:#19150f;color:var(--text);cursor:pointer}
button:hover{background:#2b2115;border-color:var(--line2)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
input,textarea{border:1px solid var(--line);border-radius:7px;background:#0b0907;color:var(--text);outline:none}
input:focus,textarea:focus{border-color:var(--gold)}
#capture{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:0}
#shell{position:absolute;inset:26px;z-index:1;display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:rgba(13,11,8,.985);box-shadow:0 26px 80px rgba(0,0,0,.7)}
#topbar{height:68px;flex:0 0 68px;display:flex;align-items:center;gap:14px;padding:0 18px;background:linear-gradient(180deg,#2b2418,#1c1710);border-bottom:1px solid var(--line)}
.title{font-size:22px;font-weight:700;letter-spacing:1px;color:var(--gold2)}
.subtitle{font-size:12px;color:var(--muted)}
.spacer{flex:1}.status{font-size:11px;color:var(--muted)}
.badge{padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#211a12;color:#d8bf84;font-size:11px}
#content{min-height:0;flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;min-height:0}.view.active{display:flex}
#mainView{gap:1px}
.side{width:270px;min-width:220px;background:#15110d;padding:14px;border-right:1px solid rgba(211,174,92,.16);display:flex;flex-direction:column;min-height:0}
.side.right{width:310px;min-width:250px;border-right:0;border-left:1px solid rgba(211,174,92,.16)}
.sideTitle{font-size:13px;color:#d8bf84;margin:0 0 10px;letter-spacing:.7px}.small{font-size:10px;color:var(--muted)}
.targetTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:7px}.targetTabs button{padding:7px 4px;font-size:11px}.targetTabs button.active{background:#604719;border-color:var(--gold);color:#fff1be}
#debugBtn{padding:7px 9px;margin-bottom:9px;font-size:10px}
.scroll{min-height:0;overflow:auto;scrollbar-width:thin}.targetItem{width:100%;text-align:left;padding:9px 10px;margin-bottom:6px;min-height:54px}.targetItem.active{background:#503a17;border-color:#e0b85e;box-shadow:inset 3px 0 #f0cd79}.targetName{font-weight:700;font-size:13px}.targetMeta{font-size:10px;color:#887e73;margin-top:4px}
#mainCenter{flex:1;min-width:0;background:#13100b;padding:14px;display:flex;flex-direction:column;min-height:0}
.centerHead{display:flex;align-items:center;gap:10px;margin-bottom:10px}.centerHead h2{font-size:17px;color:var(--gold2);margin:0}.hint{font-size:10px;color:var(--muted)}
#slotGrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(126px,1fr);gap:9px;overflow:auto}
.slot{position:relative;padding:11px;text-align:left;display:flex;flex-direction:column;min-width:0}.slot.active{background:#382914;border-color:#efc96d;box-shadow:0 0 0 1px #8b6a2b inset}.slotLabel{font-size:10px;color:#c6a35c}.slotName{margin-top:14px;font-size:15px;font-weight:700;line-height:1.25}.slotEmpty{margin-top:26px;color:#6e665e;font-size:12px}.slotMeta{margin-top:auto;display:flex;gap:10px;color:var(--blue);font-size:10px}.slotClear{position:absolute;right:7px;top:7px;width:24px;height:24px;border-radius:50%;font-size:11px;color:#a79278}
#rightCurrent{padding:12px;border:1px solid var(--line);border-radius:9px;background:#1b160f;margin-bottom:12px}.label{font-size:10px;color:var(--muted)}.value{margin-top:4px;font-size:16px;font-weight:700;color:#efd79f}
.prof{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.045);font-size:11px}.profName{flex:1;color:#bdb2a4}.profValue{color:#d7bd7c;font-weight:700}
#footer{height:62px;flex:0 0 62px;display:flex;align-items:center;gap:9px;padding:0 14px;background:linear-gradient(180deg,#241e15,#19140e);border-top:1px solid var(--line)}
#footer .leftHint{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.footerBtns{margin-left:auto;display:flex;gap:6px}.footerBtns button{padding:8px 12px}.danger{border-color:rgba(215,125,99,.38)}.primary{background:#61491b;border-color:#dcb35b;color:#fff0bb}

/* ---------- Catalog ---------- */
#catalogView{background:#100d09;flex-direction:column;padding:16px;gap:10px}
.catalogBar{height:46px;flex:0 0 46px;display:flex;gap:8px;align-items:center}.catalogTitle{font-size:18px;color:var(--gold2);font-weight:700;min-width:200px}.catalogMeta{font-size:10px;color:var(--muted)}.catalogBar input{flex:1;min-width:180px;height:36px;padding:0 11px}.catalogBack{padding:8px 12px}.catalogGrid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(150px,auto);gap:9px;padding-right:2px}
.skillCard{display:flex;flex-direction:column;text-align:left;padding:11px;min-width:0}.skillTop{display:flex;align-items:flex-start;gap:8px}.skillIcon{width:42px;height:42px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;background:#0b0907;color:#d7b967;font-size:11px;font-weight:700;flex:0 0 42px}.skillName{font-size:14px;font-weight:700;line-height:1.25}.skillType{font-size:10px;color:#cfab63;margin-top:3px}.skillDesc{margin-top:9px;color:#a49a8d;font-size:10px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.skillFoot{margin-top:auto;padding-top:8px;display:flex;gap:10px;color:var(--blue);font-size:9px}.diffs{margin-top:6px;color:#a99b83;font-size:9px}.skillCard.selected{border-color:#efc96d;box-shadow:0 0 0 1px #8b6a2b inset;background:#2f2415}

/* ---------- Forge ---------- */
#forgeView{background:#100d09;flex-direction:column;padding:14px;gap:10px}
.forgeTop{height:48px;flex:0 0 48px;display:flex;align-items:center;gap:9px}.forgeTop h2{margin:0;font-size:18px;color:var(--gold2)}.forgeName{width:260px;height:34px;padding:0 10px}.forgeMessage{flex:1;font-size:10px;color:#b19c79;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.forgeColumns{flex:1;min-height:0;display:grid;grid-template-columns:1.05fr 1fr 1.05fr;gap:9px}.forgePanel{min-height:0;display:flex;flex-direction:column;background:#14100c;border:1px solid rgba(211,174,92,.18);border-radius:9px;overflow:hidden}.forgePanelHead{padding:9px 11px;background:#1d1710;border-bottom:1px solid rgba(211,174,92,.14);font-size:12px;color:#d8bf84}.forgeList{min-height:0;overflow:auto;padding:7px}.forgeEntry{width:100%;text-align:left;padding:8px 9px;margin-bottom:5px}.forgeEntry .en{font-size:11px;font-weight:700}.forgeEntry .ed{margin-top:3px;font-size:9px;color:#8f877c;line-height:1.35}.buildEntry{display:flex;gap:7px;align-items:center}.buildEntry .remove{width:26px;height:26px;flex:0 0 26px}.forgeBottom{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:7px}.forgeBottom textarea{height:42px;flex:1;resize:none;padding:7px 10px}.forgeBottom button{padding:8px 12px}.forgeRightActions{display:flex;gap:5px}.forgeEmpty{color:#70685e;font-size:11px;padding:14px;text-align:center}

@media(max-width:1200px){#shell{inset:14px}.side{width:220px}.side.right{width:250px}.catalogGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.slotName{font-size:13px}}
@media(max-width:900px){.side{width:190px}.side.right{display:none}.catalogGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.slotGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="capture"></div>
<div id="shell">
  <header id="topbar">
    <div class="title">技能配置</div>
    <div class="subtitle" id="subtitle">技能系统</div>
    <div class="spacer"></div>
    <div class="badge" id="targetBadge">队伍成员</div>
    <div class="status" id="status">初始化…</div>
  </header>

  <main id="content">
    <!-- ==================== LEVEL 1 ==================== -->
    <section id="mainView" class="view active">
      <aside class="side">
        <div class="sideTitle">目标</div>
        <div class="targetTabs">
          <button data-type="0">队伍</button>
          <button data-type="1">兵种</button>
          <button data-type="2">领主</button>
        </div>
        <button id="debugBtn">调试模式：关</button>
        <div class="scroll" id="heroList"></div>
      </aside>

      <section id="mainCenter">
        <div class="centerHead">
          <h2>技能槽位</h2>
          <div class="hint">点击槽位进入技能目录 · 每个槽位都有独立类型过滤</div>
          <div class="spacer"></div>
          <button id="forgeBtn" class="primary">法术锻造</button>
        </div>
        <div id="slotGrid"></div>
      </section>

      <aside class="side right">
        <div class="sideTitle">当前目标</div>
        <div id="rightCurrent">
          <div class="label">角色 / 模板</div>
          <div class="value" id="currentName">—</div>
          <div class="label" style="margin-top:10px">正在编辑</div>
          <div class="value" id="activeSlot">—</div>
          <div class="label" style="margin-top:10px">修改状态</div>
          <div class="value" id="dirty">已保存</div>
        </div>
        <div class="sideTitle">原生技能熟练度</div>
        <div class="scroll" id="proficiencies"></div>
      </aside>
    </section>

    <!-- ==================== LEVEL 2: SKILL CATALOG ==================== -->
    <section id="catalogView" class="view">
      <div class="catalogBar">
        <button id="catalogBack" class="catalogBack">← 返回</button>
        <div class="catalogTitle">选择技能</div>
        <div class="catalogMeta" id="catalogMeta">—</div>
        <div class="spacer"></div>
        <input id="catalogSearch" placeholder="搜索名称、描述、ID…" autocomplete="off" />
      </div>
      <div class="catalogGrid" id="catalogGrid"></div>
    </section>

    <!-- ==================== LEVEL 2: SPELL FORGE ==================== -->
    <section id="forgeView" class="view">
      <div class="forgeTop">
        <button id="forgeBack">← 返回技能界面</button>
        <h2>法术锻造</h2>
        <input id="forgeName" class="forgeName" placeholder="法术名称" autocomplete="off" />
        <div class="forgeMessage" id="forgeMessage">—</div>
      </div>

      <div class="forgeColumns">
        <section class="forgePanel">
          <div class="forgePanelHead">素材库 · 节点 / 组件 / 官方法术 / 预设组合</div>
          <div class="forgeList" id="forgeAvailable"></div>
        </section>

        <section class="forgePanel">
          <div class="forgePanelHead">当前构筑</div>
          <div class="forgeList" id="forgeBuild"></div>
        </section>

        <section class="forgePanel">
          <div class="forgePanelHead">已注册 / 已合成法术</div>
          <div class="forgeList" id="forgeSpells"></div>
        </section>
      </div>

      <div class="forgeBottom">
        <textarea id="forgeDescription" readonly placeholder="构筑说明"></textarea>
        <button id="forgeClear">清空</button>
        <button id="forgeConfirm" class="primary">确认锻造并装备</button>
      </div>
    </section>
  </main>

  <footer id="footer">
    <div class="leftHint" id="footerHint">Shift+M 开关 · ↑↓ 目标 · 1~8 技能槽 · Enter 确认 · Esc 返回/关闭</div>
    <div class="footerBtns">
      <button id="undo">撤销</button>
      <button id="export">导出</button>
      <button id="apply" class="primary">应用</button>
      <button id="close" class="danger">关闭</button>
    </div>
  </footer>
</div>

<script>
(() => {
  'use strict';

  const app = window.game.app;
  let state = null;
  let catalogCursor = 0;
  let forgeSearchAvailable = '';
  let forgeSearchSpells = '';

  const $ = id => document.getElementById(id);
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

  function call(name, payload = {}) {
    try {
      return Promise.resolve(app.call(name, payload, 10000)).catch(e => {
        console.error('[CustomSkill]', name, e);
        $('status').textContent = '桥接错误';
      });
    } catch (e) {
      console.error('[CustomSkill]', name, e);
      $('status').textContent = '桥接错误';
      return Promise.reject(e);
    }
  }

  function setActiveView(view) {
    for (const id of ['mainView','catalogView','forgeView']) {
      $(id).classList.toggle('active', id === view);
    }
  }

  function render(s) {
    state = s || null;
    if (!state) return;

    $('targetBadge').textContent = state.targetTypeText || '—';
    $('currentName').textContent = state.currentHeroName || '—';
    $('activeSlot').textContent = state.activeSlot || '—';
    $('dirty').textContent = state.dirty ? '● 未保存' : '● 已保存';
    $('dirty').style.color = state.dirty ? '#e2a84f' : '#7f9d78';
    $('status').textContent = state.exportStatus || '已连接';
    $('debugBtn').textContent = '调试模式：' + (state.debugMode ? '开' : '关');

    document.querySelectorAll('.targetTabs button').forEach(btn => {
      btn.classList.toggle('active', Number(btn.dataset.type) === Number(state.targetType));
    });

    renderHeroes();
    renderSlots();
    renderProficiencies();
    renderCatalog();
    renderForge();

    if (state.view === 'catalog') setActiveView('catalogView');
    else if (state.view === 'forge') setActiveView('forgeView');
    else setActiveView('mainView');
  }

  function renderHeroes() {
    const list = state.heroes || [];
    $('heroList').innerHTML = list.length ? list.map(h => `
      <button class="targetItem ${h.selected ? 'active' : ''}" data-index="${h.index}">
        <div class="targetName">${escapeHtml(h.name)}</div>
        <div class="targetMeta">${escapeHtml(h.subtitle)}</div>
      </button>`).join('') : '<div class="small">没有可用目标</div>';
    $('heroList').querySelectorAll('.targetItem').forEach(btn => btn.addEventListener('click', () => {
      call('selectHero', { index: Number(btn.dataset.index) });
    }));
  }

  function renderSlots() {
    const slots = state.slots || [];
    $('slotGrid').innerHTML = slots.map(s => `
      <div class="slot ${s.active ? 'active' : ''}" data-index="${s.index}">
        <div class="slotLabel">${escapeHtml(s.label)}</div>
        ${s.empty ? '<div class="slotEmpty">— 空槽 —</div>' : `
          <div class="slotName">${escapeHtml(s.skillName)}</div>
          <div class="slotMeta"><span>冷却 ${escapeHtml(s.cooldown)}</span><span>消耗 ${escapeHtml(s.cost)}</span></div>`}
        ${s.empty ? '' : `<button class="slotClear" title="清空槽位" data-clear="${s.index}">×</button>`}
      </div>`).join('');

    $('slotGrid').querySelectorAll('.slot').forEach(card => {
      card.addEventListener('click', e => {
        if (e.target.closest('[data-clear]')) return;
        call('selectSlot', { index: Number(card.dataset.index) });
      });
    });
    $('slotGrid').querySelectorAll('[data-clear]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        call('clearSlot', { index: Number(btn.dataset.clear) });
      });
    });
  }

  function renderProficiencies() {
    $('proficiencies').innerHTML = (state.proficiencies || []).map(p => `
      <div class="prof"><span class="profName">${escapeHtml(p.name)}</span><span class="profValue">${escapeHtml(p.text)}</span></div>`).join('');
  }

  function renderCatalog() {
    if (state.view !== 'catalog') return;
    const list = state.catalog || [];
    catalogCursor = clamp(catalogCursor, 0, Math.max(0, list.length - 1));
    $('catalogSearch').value = state.catalogSearch || '';
    $('catalogMeta').textContent = `${escapeHtml(state.activeSlot || '槽位')} · ${list.length} 项`;

    $('catalogGrid').innerHTML = list.length ? list.map((s, i) => {
      const diff = (s.difficulties || []).map(d => `${escapeHtml(d.attribute)} ${d.difficulty}`).join(' · ');
      return `
      <button class="skillCard ${i === catalogCursor ? 'selected' : ''}" data-skill="${escapeHtml(s.id)}">
        <div class="skillTop">
          <div class="skillIcon">${escapeHtml((s.type || '?').slice(0,2))}</div>
          <div><div class="skillName">${escapeHtml(s.name)}</div><div class="skillType">${escapeHtml(s.type)}</div></div>
        </div>
        <div class="skillDesc">${escapeHtml(s.description)}</div>
        ${diff ? `<div class="diffs">难度：${diff}</div>` : ''}
        <div class="skillFoot"><span>冷却 ${Number(s.cooldown || 0).toFixed(1)}s</span><span>消耗 ${Number(s.cost || 0).toFixed(0)}</span></div>
      </button>`;
    }).join('') : '<div class="small">没有符合当前槽位类型的技能</div>';

    $('catalogGrid').querySelectorAll('.skillCard').forEach((card, index) => {
      card.addEventListener('mouseenter', () => { catalogCursor = index; highlightCatalog(); });
      card.addEventListener('click', () => call('catalogSelect', { skillId: card.dataset.skill }));
    });
  }

  function highlightCatalog() {
    $('catalogGrid').querySelectorAll('.skillCard').forEach((el, i) => el.classList.toggle('selected', i === catalogCursor));
    const current = $('catalogGrid').querySelectorAll('.skillCard')[catalogCursor];
    current?.scrollIntoView({block:'nearest',inline:'nearest'});
  }

  function renderForge() {
    if (state.view !== 'forge' || !state.forge) return;
    const f = state.forge;
    $('forgeName').value = f.newSpellName || '';
    $('forgeDescription').value = f.buildDescription || '';
    $('forgeMessage').textContent = f.validationMessage || '从左侧加入节点、组件或子法术。';

    const filterText = forgeSearchAvailable.trim().toLowerCase();
    const available = (f.availableNodes || []).filter(x => !filterText || `${x.name} ${x.description} ${x.id}`.toLowerCase().includes(filterText));
    $('forgeAvailable').innerHTML = available.length ? available.map(x => `
      <button class="forgeEntry" data-forge-add="${escapeHtml(x.id)}">
        <div class="en">${escapeHtml(x.name)}</div><div class="ed">${escapeHtml(x.description)}</div>
      </button>`).join('') : '<div class="forgeEmpty">没有匹配素材</div>';

    const build = f.currentBuild || [];
    $('forgeBuild').innerHTML = build.length ? build.map(x => `
      <div class="forgeEntry buildEntry">
        <button class="remove" title="移除" data-forge-remove="${escapeHtml(x.id)}">×</button>
        <div><div class="en">${escapeHtml(x.name)}</div><div class="ed">${escapeHtml(x.description)}</div></div>
      </div>`).join('') : '<div class="forgeEmpty">尚未加入组件</div>';

    const spellFilter = forgeSearchSpells.trim().toLowerCase();
    const spells = (f.allSpells || []).filter(x => !spellFilter || `${x.name} ${x.description} ${x.id}`.toLowerCase().includes(spellFilter));
    $('forgeSpells').innerHTML = spells.length ? spells.map(x => `
      <div class="forgeEntry">
        <div class="en">${escapeHtml(x.name)}</div>
        <div class="ed">${escapeHtml(x.description)}</div>
        <div class="forgeRightActions" style="margin-top:7px">
          <button data-forge-edit="${escapeHtml(x.id)}">编辑</button>
          <button data-forge-equip="${escapeHtml(x.id)}">装备</button>
        </div>
      </div>`).join('') : '<div class="forgeEmpty">没有已注册法术</div>';

    $('forgeAvailable').querySelectorAll('[data-forge-add]').forEach(btn => btn.addEventListener('click', () => call('forgeAdd', {id: btn.dataset.forgeAdd})));
    $('forgeBuild').querySelectorAll('[data-forge-remove]').forEach(btn => btn.addEventListener('click', () => call('forgeRemove', {id: btn.dataset.forgeRemove})));
    $('forgeSpells').querySelectorAll('[data-forge-edit]').forEach(btn => btn.addEventListener('click', () => call('forgeEdit', {id: btn.dataset.forgeEdit})));
    $('forgeSpells').querySelectorAll('[data-forge-equip]').forEach(btn => btn.addEventListener('click', () => call('forgeEquip', {id: btn.dataset.forgeEquip})));
  }

  app.state.subscribe('customSkill', render);

  document.querySelectorAll('.targetTabs button').forEach(btn => btn.addEventListener('click', () => call('setTargetType', {value: Number(btn.dataset.type)})));
  $('debugBtn').addEventListener('click', () => call('toggleDebug'));
  $('forgeBtn').addEventListener('click', () => call('openForge'));
  $('catalogBack').addEventListener('click', () => call('catalogBack'));
  $('forgeBack').addEventListener('click', () => call('forgeBack'));
  $('undo').addEventListener('click', () => call('undo'));
  $('apply').addEventListener('click', () => call('apply'));
  $('export').addEventListener('click', () => call('export'));
  $('close').addEventListener('click', () => call('close'));
  $('forgeClear').addEventListener('click', () => call('forgeClear'));
  $('forgeConfirm').addEventListener('click', () => call('forgeConfirm'));

  $('catalogSearch').addEventListener('input', () => {
    catalogCursor = 0;
    call('searchCatalog', {text: $('catalogSearch').value});
  });

  $('forgeName').addEventListener('input', () => call('forgeSetName', {value: $('forgeName').value}));

  // ---------- 全输入捕获 ----------
  window.addEventListener('contextmenu', e => e.preventDefault(), true);
  window.addEventListener('dragstart', e => e.preventDefault(), true);
  window.addEventListener('selectstart', e => {
    if (!e.target.closest('input,textarea')) e.preventDefault();
  }, true);

  window.addEventListener('keydown', e => {
    const target = e.target;
    const textInput = target && (target.matches?.('input,textarea') || target.isContentEditable);

    if (e.key === 'Escape') {
      e.preventDefault();
      e.stopPropagation();
      if (state?.view === 'catalog') call('catalogBack');
      else if (state?.view === 'forge') call('forgeBack');
      else call('close');
      return;
    }

    if (textInput) return;
    if (!state) return;

    // All remaining keyboard input is owned by this page.
    e.preventDefault();
    e.stopPropagation();

    if (state.view === 'catalog') {
      const n = (state.catalog || []).length;
      if (!n) return;
      if (e.key === 'ArrowDown') { catalogCursor = (catalogCursor + 1) % n; highlightCatalog(); }
      else if (e.key === 'ArrowUp') { catalogCursor = (catalogCursor - 1 + n) % n; highlightCatalog(); }
      else if (e.key === 'ArrowRight') { catalogCursor = Math.min(n - 1, catalogCursor + 4); highlightCatalog(); }
      else if (e.key === 'ArrowLeft') { catalogCursor = Math.max(0, catalogCursor - 4); highlightCatalog(); }
      else if (e.key === 'Enter') {
        const item = (state.catalog || [])[catalogCursor];
        if (item) call('catalogSelect', {skillId: item.id});
      } else if (e.key >= '1' && e.key <= '8') {
        call('catalogBack');
        call('selectSlot', {index: Number(e.key) - 1});
      }
      return;
    }

    if (state.view === 'forge') {
      if (e.key === 'Enter' && e.ctrlKey) call('forgeConfirm');
      return;
    }

    if (e.key === 'ArrowDown') call('selectHero', {index: Math.min((state.heroes?.length || 1) - 1, (state.heroes || []).findIndex(x => x.selected) + 1)});
    else if (e.key === 'ArrowUp') call('selectHero', {index: Math.max(0, (state.heroes || []).findIndex(x => x.selected) - 1)});
    else if (e.key >= '1' && e.key <= '8') call('selectSlot', {index: Number(e.key) - 1});
    else if (e.key === 'F12') call('toggleDebug');
    else if (e.key === 'F8') call('openForge');
    else if (e.key === 'Tab') call('setTargetType', {value: ((Number(state.targetType) + 1) % 3)});
    else if (e.key.toLowerCase() === 's' && e.ctrlKey) call('apply');
    else if (e.key.toLowerCase() === 'z' && e.ctrlKey) call('undo');
    else if (e.key.toLowerCase() === 'e' && e.ctrlKey) call('export');
  }, true);

  // 捕获所有鼠标输入，确保透明背景区域也属于 WebView，而不是 Bannerlord。
  window.addEventListener('pointerdown', e => { e.preventDefault(); }, true);
  window.addEventListener('pointerup', e => { e.stopPropagation(); }, true);

  // 首次状态从 C# request 获取，后续使用 owner-scoped state 推送。
  (async () => {
    try {
      const initial = await app.request('getState', {}, 10000);
      render(initial);
    } catch (e) {
      console.error('[CustomSkill] initial state failed', e);
      $('status').textContent = '初始状态读取失败';
    }
  })();
})();
</script>
</body>
</html>
