<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tactical Map</title>
  <link rel="stylesheet" href="tactical-map.css">
</head>
<body>
  <div id="app" class="map-shell mode-compact-passive" aria-hidden="true">
    <header class="topbar">
      <div>
        <div class="eyebrow">NEW_ZZZF / BATTLEFIELD</div>
        <h1>Tactical Map</h1>
        <div id="shortcutHint" class="eyebrow">快捷键：N 进入/退出全屏操作　ESC 退出全屏操作</div>
      </div>
      <div id="modeLabel" class="mode-label">观察</div>
    </header>

    <main class="layout">
      <aside id="formationPanel" class="panel formation-panel">
        <div class="panel-title">编队</div>
        <div id="formationList" class="formation-list"></div>
      </aside>

      <section class="map-panel">
        <canvas id="mapCanvas" width="1024" height="768" tabindex="0" aria-label="战场地图"></canvas>
        <div id="hint" class="hint">被动小图　按 N 进入全屏操作</div>
      </section>

      <aside id="detailPanel" class="panel detail-panel">
        <div class="panel-title">编队详情</div>
        <div id="detailBody" class="detail-body">选择一个编队查看详细信息</div>
      </aside>
    </main>

    <footer class="statusbar">
      <div id="statusText">TacticalMap 初始化中…</div>
      <div class="legend">
        <span><i class="dot player"></i>玩家</span>
        <span><i class="dot friendly"></i>友军</span>
        <span><i class="dot enemy"></i>敌军</span>
        <span><i class="dot neutral"></i>中立</span>
        <span><i class="diamond camera"></i>镜头目标</span>
      </div>
    </footer>
  </div>

  <script>
  (() => {
    'use strict';
    const app = window.game.app;

    window.addEventListener('keydown', event => {
      const key = String(event.key || '').toLowerCase();

      if (key === 'n') {
        event.preventDefault();
        event.stopImmediatePropagation();
        try { app.call('toggleInteractive').catch(() => {}); } catch (_) {}
        return;
      }

      if (key === 'escape') {
        let interactive = false;
        try { interactive = !!app.state.get('tacticalMap.runtime')?.interactive; } catch (_) {}
        if (!interactive) return;

        event.preventDefault();
        event.stopImmediatePropagation();
        try { app.call('escape').catch(() => {}); } catch (_) {}
      }
    }, true);
  })();
  </script>
  <script src="tactical-map.js"></script>
</body>
</html>
