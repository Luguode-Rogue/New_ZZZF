<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Segoe UI","Microsoft YaHei",sans-serif;pointer-events:none;color:#f1e7d4}#hint{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);min-width:300px;padding:11px 16px;border:1px solid rgba(216,183,109,.48);border-radius:8px;background:rgba(18,16,13,.82);text-align:center;opacity:0;transition:opacity .12s}#hint.show{opacity:1}.name{font-size:14px;color:#f0cf86}.text{font-size:12px;color:#c9beaa;margin-top:3px}.bar{height:3px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}.fill{height:100%;width:0;background:#e0bb67;transition:width .05s linear}
</style></head><body><div id="hint"><div class="name" id="name"></div><div class="text" id="text"></div><div class="bar"><div class="fill" id="fill"></div></div></div><script>
(()=>{const app=window.game.app,root=document.getElementById('hint');app.state.subscribe('equipmentHint',s=>{if(!s){root.classList.remove('show');return}root.classList.toggle('show',!!s.visible);document.getElementById('name').textContent=s.target||'';document.getElementById('text').textContent=s.text||'';document.getElementById('fill').style.width=(Math.max(0,Math.min(1,Number(s.progress)||0))*100)+'%'})})();
</script></body></html>
