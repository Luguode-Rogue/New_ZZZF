<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZZZF 战斗 HUD</title>
<style>
:root{
  --text:#eadfce;--muted:#9b9185;
  --gold:#e8c36e;--gold2:#f5dda5;
  --stam:#7da05e;--mana:#5e82a8;
  --panel:rgba(18,15,11,.72);--line:rgba(211,174,92,.30);
  font-family:"Segoe UI","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--text)}
body{pointer-events:none;user-select:none}
#hud{position:fixed;inset:0;pointer-events:none}
#hud.hidden{display:none}
/* 右侧 HUD 统一容器：资源条在上，技能栏紧接其下，严格同宽。 */
#rightHud{position:absolute;right:16px;top:409px;width:400px}
#vitals{position:relative;width:100%;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--panel);box-shadow:0 6px 24px rgba(0,0,0,.45)}
.bar{position:relative;height:16px;margin-top:7px;border-radius:8px;background:rgba(0,0,0,.55);overflow:hidden;border:1px solid rgba(255,255,255,.06)}
.bar:first-child{margin-top:0}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:7px;transform:scaleX(0);transform-origin:left center;transition:transform .10s linear;will-change:transform}
.bar.stam .fill{background:linear-gradient(180deg,#93bb72,#678a4c)}
.bar.mana .fill{background:linear-gradient(180deg,#7496bd,#4d6f96)}
.bar .label{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 8px;font-size:10.5px;line-height:1;color:#f2ecdd;text-shadow:0 1px 2px rgba(0,0,0,.9)}
#badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.badge{padding:3px 8px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.45);
  color:#d8bf84;font-size:10px;line-height:1.4}
.badge.off{display:none}
#gcdBadge{color:#ffd98a}

/* 资源条正下方：第一排四法术，第二排主/副/被动/战技。 */
#skillbar{position:relative;width:100%;margin-top:8px;
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,56px);gap:6px;
  padding:8px 9px;border:1px solid var(--line);border-radius:11px;background:var(--panel);
  box-shadow:0 6px 24px rgba(0,0,0,.45)}
.skill{position:relative;width:100%;height:56px;border:1px solid rgba(211,174,92,.25);border-radius:9px;
  background:rgba(8,6,4,.72);overflow:hidden}
.skill.selected{border-color:var(--gold);box-shadow:0 0 0 1px rgba(232,195,110,.55),0 0 10px rgba(232,195,110,.25)}
.skill .cdFill{position:absolute;left:0;right:0;bottom:0;height:100%;background:rgba(105,105,105,.48);
  border-top:1px solid rgba(232,195,110,.35);transform:scaleY(0);transform-origin:center bottom;transition:transform .10s linear;will-change:transform}
.skill .durationFill{position:absolute;left:0;right:0;bottom:0;height:100%;background:rgba(235,135,36,.48);
  border-top:1px solid rgba(255,186,97,.8);transform:scaleY(0);transform-origin:center bottom;transition:transform .10s linear;will-change:transform}
.skill .cdText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:#ffe3a0;text-shadow:0 1px 3px rgba(0,0,0,.95)}
.skill .cdText.duration{color:#ffba61}
.skill .cdText.cooldown{color:#d6d9dc}
.skill .name{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:9px;line-height:1.15;
  color:var(--text);text-shadow:0 1px 2px rgba(0,0,0,.95);padding:0 3px;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.skill .key{position:absolute;left:0;top:0;padding:1px 5px;font-size:8.5px;color:#cdb27b;
  background:rgba(0,0,0,.5);border-bottom-right-radius:6px}
.skill .cost{position:absolute;right:2px;top:2px;font-size:8.5px;color:var(--muted)}
.skill.mana .cost{color:#9db8d8}
.skill.gcd .cdFill{background:rgba(60,45,20,.72)}
.skill.empty{opacity:.38}
.skill.empty .name{color:#8d8478}
</style>
</head>
<body>
<div id="hud" class="hidden">
  <div id="rightHud">
    <div id="vitals">
      <div class="bar stam"><div class="fill" id="stamFill"></div><div class="label"><span>耐力</span><span id="stamText"></span></div></div>
      <div class="bar mana"><div class="fill" id="manaFill"></div><div class="label"><span>法力</span><span id="manaText"></span></div></div>
      <div id="badges">
        <span class="badge off" id="shieldBadge"></span>
        <span class="badge off" id="livesBadge"></span>
        <span class="badge off" id="gcdBadge">公共冷却</span>
      </div>
    </div>
    <div id="skillbar"></div>
  </div>
</div>
<script>
(() => {
  'use strict';
  // Coexist Surface 可能被挂载到其他 Page 的同源 iframe 中；显式绑定
  // BattleHud scope，避免首屏恢复依赖宿主页面推断出的默认 owner。
  const app = window.game.scope('New_ZZZF.BattleHud');
  const hud = document.getElementById('hud');
  const skillbar = document.getElementById('skillbar');
  const SLOT_KEYS = {
    spell0:'法术1', spell1:'法术2', spell2:'法术3', spell3:'法术4',
    main:'E', sub:'Alt', passive:'被动', combat:'战技'
  };
  const LAYOUT = ['spell0','spell1','spell2','spell3','main','sub','passive','combat'];
  let skillsBySlot = {};
  const skillCellRefs = new Map();
  const lastBarValues = new Map();
  let lastStructureSig = '';
  let latestState = null;
  let countdownInterval = 0;
  let surfaceVisible = false;
  let pageActive = true;
  const surfaceId = window.game.surface && window.game.surface.id;
  const localCooldowns = new Map();
  const localDurations = new Map();
  let localGcd = { remaining: 0, max: 0, stamp: 0 };
  const fmt = v => Math.round(Number(v) || 0);
  const nowMs = () => (window.performance && typeof window.performance.now === 'function')
    ? window.performance.now()
    : Date.now();

  function remainingOf(timer, now) {
    if (!timer || timer.remaining <= 0) return 0;
    return Math.max(0, timer.remaining - (now - timer.stamp) / 1000);
  }

  function syncLocalCountdowns(state) {
    const now = nowMs();
    const seen = new Set();
    const compact = Array.isArray(state);
    const timers = compact ? LAYOUT : (state.skills || []);

    for (let i = 0; i < timers.length; i++) {
      const s = compact ? null : timers[i];
      const slot = compact ? timers[i] : s.slot;
      seen.add(slot);
      const cd = Math.max(0, Number(compact ? state[i + 1] : s.cd) || 0);
      if (cd > 0.001) {
        localCooldowns.set(slot, { remaining: cd, stamp: now });
      } else {
        localCooldowns.delete(slot);
      }
      const dur = Math.max(0, Number(compact ? state[9 + i] : s.dur) || 0);
      const durMax = Math.max(dur, Number(compact ? state[17 + i] : s.durMax) || 0);
      if (dur > 0.001) {
        localDurations.set(slot, { remaining: dur, max: durMax, stamp: now });
      } else {
        localDurations.delete(slot);
      }
    }

    for (const slot of Array.from(localCooldowns.keys())) {
      if (!seen.has(slot)) localCooldowns.delete(slot);
    }
    for (const slot of Array.from(localDurations.keys())) {
      if (!seen.has(slot)) localDurations.delete(slot);
    }

    const gcd = Math.max(0, Number(compact ? state[0] : state.gcd) || 0);
    if (gcd > 0.001) {
      const oldRemaining = remainingOf(localGcd, now);
      const continuing = oldRemaining > 0.001;
      localGcd = {
        remaining: gcd,
        max: continuing ? Math.max(localGcd.max, gcd) : gcd,
        stamp: now
      };
    } else {
      localGcd = { remaining: 0, max: 0, stamp: now };
    }

    updateCountdownLoop();
  }

  function hasActiveCountdown(now) {
    if (remainingOf(localGcd, now) > 0.001) return true;
    for (const timer of localCooldowns.values()) {
      if (remainingOf(timer, now) > 0.001) return true;
    }
    for (const timer of localDurations.values()) {
      if (remainingOf(timer, now) > 0.001) return true;
    }
    return false;
  }

  function updateCountdownLoop() {
    const active = hasActiveCountdown(nowMs());
    if (active && surfaceVisible && pageActive && !countdownInterval) {
      countdownInterval = window.setInterval(() => {
        if (!surfaceVisible || !pageActive || !latestState || !latestState.available) {
          window.clearInterval(countdownInterval);
          countdownInterval = 0;
          return;
        }

        const now = nowMs();
        updateSkillCells(latestState, now);
        updateGcdBadge(now);

        if (!hasActiveCountdown(now)) {
          window.clearInterval(countdownInterval);
          countdownInterval = 0;
        }
      }, 100);
    } else if ((!active || !surfaceVisible || !pageActive) && countdownInterval) {
      window.clearInterval(countdownInterval);
      countdownInterval = 0;
    }
  }

  function applySurfaceVisibility(surfaces, forceRefresh) {
    const surface = Array.isArray(surfaces) && surfaces.find(item => item && item.id === surfaceId);
    const nextVisible = !surfaceId || !!(surface && surface.visible);
    if (surfaceVisible === nextVisible && !forceRefresh) return;
    const becameVisible = !surfaceVisible && nextVisible;
    surfaceVisible = nextVisible;
    if (surfaceVisible && latestState && latestState.available && (becameVisible || forceRefresh)) {
      const now = nowMs();
      updateSkillCells(latestState, now);
      updateGcdBadge(now);
    }
    updateCountdownLoop();
  }

  function renderBar(fillId, textId, cur, max) {
    const pct = max > 0 ? Math.max(0, Math.min(100, (Number(cur) / max) * 100)) : 0;
    const roundedPct = Math.round(pct * 10) / 10;
    const text = fmt(cur) + '/' + fmt(max);
    const previous = lastBarValues.get(fillId);
    if (!previous || previous.pct !== roundedPct) document.getElementById(fillId).style.transform = 'scaleX(' + (roundedPct / 100) + ')';
    if (!previous || previous.text !== text) document.getElementById(textId).textContent = text;
    lastBarValues.set(fillId, { pct: roundedPct, text });
  }

  function toggleClass(el, name, enabled) {
    if (el.classList.contains(name) !== enabled) el.classList.toggle(name, enabled);
  }

  function structureSignature(skills) {
    return JSON.stringify((skills || []).map(s => [
      s.slot, !!s.empty, s.id || '', s.name || '',
      Number(s.cost) || 0, !!s.mana, !!s.passive
    ]));
  }

  function renderSkillBar(skills) {
    const nextBySlot = {};
    for (const s of (skills || [])) nextBySlot[s.slot] = s;
    skillsBySlot = nextBySlot;

    const sig = structureSignature(skills);
    if (sig === lastStructureSig) return;
    lastStructureSig = sig;

    skillbar.innerHTML = '';
    skillCellRefs.clear();
    for (const slot of LAYOUT) {
      const s = skillsBySlot[slot];
      if (!s) continue;
      const empty = !!s.empty;
      const cell = document.createElement('div');
      cell.className = 'skill' + (empty ? ' empty' : '') + (s.mana ? ' mana' : '');
      cell.dataset.slot = slot;
      cell.innerHTML =
        '<div class="key">' + (SLOT_KEYS[slot] || '') + '</div>' +
        (!empty && !s.passive ? '<div class="cost">' + fmt(s.cost) + '</div>' : '') +
        '<div class="cdFill"></div><div class="durationFill"></div><div class="cdText"></div>' +
        '<div class="name"></div>';
      skillbar.appendChild(cell);
      skillCellRefs.set(slot, {
        cell,
        fill: cell.querySelector('.cdFill'),
        durationFill: cell.querySelector('.durationFill'),
        text: cell.querySelector('.cdText'),
        name: cell.querySelector('.name'),
        fillValue: null,
        durationFillValue: null,
        textValue: null,
        nameValue: null,
        opacityValue: null
      });
    }
  }

  function updateSkillCells(state, now) {
    now = now || nowMs();
    const gcdRemaining = remainingOf(localGcd, now);
    const gcd = gcdRemaining > 0.01;
    for (const slot of LAYOUT) {
      const refs = skillCellRefs.get(slot);
      if (!refs) continue;
      const cell = refs.cell;
      const s = skillsBySlot[slot];
      if (!s) continue;
      const fill = refs.fill;
      const durationFill = refs.durationFill;
      const text = refs.text;
      const name = refs.name;
      toggleClass(cell, 'selected', !!s.selected);

      if (s.empty) {
        if (refs.nameValue !== '空') { name.textContent = '空'; refs.nameValue = '空'; }
        if (refs.fillValue !== 0) { fill.style.transform = 'scaleY(0)'; refs.fillValue = 0; }
        if (refs.durationFillValue !== 0) { durationFill.style.transform = 'scaleY(0)'; refs.durationFillValue = 0; }
        if (refs.textValue !== '') { text.textContent = ''; refs.textValue = ''; }
        toggleClass(cell, 'gcd', false);
        continue;
      }

      const nextName = s.name || s.id || '';
      if (refs.nameValue !== nextName) { name.textContent = nextName; refs.nameValue = nextName; }

      if (s.passive) {
        if (refs.fillValue !== 0) { fill.style.transform = 'scaleY(0)'; refs.fillValue = 0; }
        if (refs.durationFillValue !== 0) { durationFill.style.transform = 'scaleY(0)'; refs.durationFillValue = 0; }
        if (refs.textValue !== '') { text.textContent = ''; refs.textValue = ''; }
        toggleClass(cell, 'gcd', false);
        if (refs.opacityValue !== '1') { cell.style.opacity = '1'; refs.opacityValue = '1'; }
        continue;
      }

      const cd = remainingOf(localCooldowns.get(s.slot), now);
      const cdMax = Math.max(0.01, Number(s.cdMax) || 0.01);
      const gcdMax = Math.max(0.01, Number(localGcd.max) || 0.01);
      const gcdRatio = (gcd && s.mana) ? Math.min(1, gcdRemaining / gcdMax) : 0;
      const ratio = Math.max(cd > 0 ? cd / cdMax : 0, gcdRatio);
      const fillValue = Math.round(Math.min(1, ratio) * 100) / 100;
      const durationTimer = localDurations.get(s.slot);
      const duration = remainingOf(durationTimer, now);
      const durationRatio = durationTimer ? duration / Math.max(0.01, durationTimer.max) : 0;
      const durationFillValue = Math.round(Math.min(1, durationRatio) * 100) / 100;
      const showingDuration = duration > 0.05;
      const showingCooldown = !showingDuration && cd > 0.05;
      const displayTime = showingDuration ? duration : cd;
      const textValue = showingDuration || showingCooldown
        ? (displayTime >= 10 ? String(Math.ceil(displayTime)) : displayTime.toFixed(1)) : '';
      if (refs.fillValue !== fillValue) { fill.style.transform = 'scaleY(' + fillValue + ')'; refs.fillValue = fillValue; }
      if (refs.durationFillValue !== durationFillValue) { durationFill.style.transform = 'scaleY(' + durationFillValue + ')'; refs.durationFillValue = durationFillValue; }
      if (refs.textValue !== textValue) { text.textContent = textValue; refs.textValue = textValue; }
      toggleClass(text, 'duration', showingDuration);
      toggleClass(text, 'cooldown', showingCooldown);
      toggleClass(cell, 'gcd', cd <= 0.01 && gcd && s.mana);

      const pool = s.mana ? Number(state.mana) : Number(state.stamina);
      const opacity = (!cd && pool < Number(s.cost || 0)) ? '0.55' : '1';
      if (refs.opacityValue !== opacity) { cell.style.opacity = opacity; refs.opacityValue = opacity; }
    }
  }

  function updateGcdBadge(now) {
    const gcdOn = remainingOf(localGcd, now || nowMs()) > 0.01;
    document.getElementById('gcdBadge').classList.toggle('off', !gcdOn);
  }

  function applyVitalsState(values) {
    if (!Array.isArray(values) || !latestState || !latestState.available) return;
    latestState.stamina = Number(values[0]) || 0;
    latestState.mana = Number(values[1]) || 0;
    latestState.shield = Number(values[2]) || 0;
    latestState.lives = Number(values[3]) || 0;

    renderBar('stamFill', 'stamText', latestState.stamina, 100);
    renderBar('manaFill', 'manaText', latestState.mana, 100);

    const shieldBadge = document.getElementById('shieldBadge');
    const shield = fmt(latestState.shield);
    toggleClass(shieldBadge, 'off', shield <= 0);
    shieldBadge.textContent = '护盾 ' + shield;

    const livesBadge = document.getElementById('livesBadge');
    const lives = fmt(latestState.lives);
    toggleClass(livesBadge, 'off', lives <= 0);
    livesBadge.textContent = '复活 ' + lives;

    updateSkillCells(latestState, nowMs());
  }

  function applyTimersState(values) {
    if (!Array.isArray(values) || !latestState || !latestState.available) return;
    syncLocalCountdowns(values);
    const now = nowMs();
    updateSkillCells(latestState, now);
    updateGcdBadge(now);
  }

  function applySelectionState(value) {
    if (!latestState || !latestState.available) return;
    const selected = Math.max(0, Math.min(3, Number(value) || 0));
    latestState.selectedSpellSlot = selected;
    for (const skill of (latestState.skills || [])) {
      skill.selected = skill.slot === ('spell' + selected);
    }
    updateSkillCells(latestState, nowMs());
  }

  function render(state) {
    latestState = state;
    if (!state || !state.available) {
      localCooldowns.clear();
      localDurations.clear();
      localGcd = { remaining: 0, max: 0, stamp: nowMs() };
      updateCountdownLoop();
      hud.classList.add('hidden');
      return;
    }

    hud.classList.remove('hidden');
    syncLocalCountdowns(state);
    renderBar('stamFill', 'stamText', state.stamina, 100);
    renderBar('manaFill', 'manaText', state.mana, 100);

    const shield = fmt(state.shield);
    const shieldBadge = document.getElementById('shieldBadge');
    shieldBadge.classList.toggle('off', shield <= 0);
    shieldBadge.textContent = '护盾 ' + shield;

    const lives = Number(state.lives) || 0;
    const livesBadge = document.getElementById('livesBadge');
    livesBadge.classList.toggle('off', lives <= 0);
    livesBadge.textContent = '复活 ' + lives;

    renderSkillBar(state.skills);
    const now = nowMs();
    updateSkillCells(state, now);
    updateGcdBadge(now);
  }

  const hydrate = () => {
    try {
      render(app.state.get('battleHud'));
      applyVitalsState(app.state.get('battleHud.vitals'));
      applyTimersState(app.state.get('battleHud.timers'));
      applySelectionState(app.state.get('battleHud.selection'));
    } catch (_) {}
  };

  // 主动请求一次完整状态。共存 iframe 的 retained-state 快照若因装载时序
  // 未送达，HUD 仍可独立完成首次显示；后续变化继续走拆分后的轻量状态。
  const requestCurrentState = () => {
    try {
      return app.request('getState').then(render).catch(() => {});
    } catch (_) {
      return Promise.resolve();
    }
  };
  const reportReady = () => {
    try {
      if (window.game.surface && typeof window.game.surface.ready === 'function')
        window.game.surface.ready({ component: 'BattleHud' }).catch(() => {});
    } catch (_) {}
  };
  window.addEventListener('pagehide', () => {
    pageActive = false;
    updateCountdownLoop();
  });
  window.addEventListener('pageshow', () => {
    pageActive = true;
    try { applySurfaceVisibility(window.game.state.get('framework.surfaces'), true); } catch (_) { updateCountdownLoop(); }
  });
  if (window.game.state && typeof window.game.state.watch === 'function') {
    window.game.state.watch('framework.surfaces', applySurfaceVisibility);
  } else if (window.game.state && typeof window.game.state.subscribe === 'function') {
    window.game.state.subscribe('framework.surfaces', applySurfaceVisibility);
    try { applySurfaceVisibility(window.game.state.get('framework.surfaces')); } catch (_) {}
  }
  if (typeof app.state.watch === 'function') {
    app.state.watch('battleHud', render);
    app.state.watch('battleHud.vitals', applyVitalsState);
    app.state.watch('battleHud.timers', applyTimersState);
    app.state.watch('battleHud.selection', applySelectionState);
    window.game.ready().then(() => { reportReady(); requestCurrentState(); })
      .catch(() => { requestCurrentState(); });
  } else {
    // 旧版 Framework 的兼容回退；新版由 watch 负责无竞态首屏水合。
    app.state.subscribe('battleHud', render);
    app.state.subscribe('battleHud.vitals', applyVitalsState);
    app.state.subscribe('battleHud.timers', applyTimersState);
    app.state.subscribe('battleHud.selection', applySelectionState);
    requestCurrentState();
    if (window.game && typeof window.game.ready === 'function') {
      window.game.ready().then(() => { hydrate(); requestCurrentState(); }).catch(() => { hydrate(); requestCurrentState(); });
    } else hydrate();
  }
})();
</script>
</body>
</html>
