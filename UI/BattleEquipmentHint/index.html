<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Segoe UI","Microsoft YaHei",sans-serif;pointer-events:none;color:#f1e7d4}#hint{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);min-width:300px;padding:11px 16px;border:1px solid rgba(216,183,109,.48);border-radius:8px;background:rgba(18,16,13,.82);text-align:center;opacity:0;transition:opacity .12s}#hint.show{opacity:1}.name{font-size:14px;color:#f0cf86}.text{font-size:12px;color:#c9beaa;margin-top:3px}.bar{height:3px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}.fill{height:100%;width:0;background:#e0bb67;transition:width .05s linear}
</style></head><body><div id="hint"><div class="name" id="name"></div><div class="text" id="text"></div><div class="bar"><div class="fill" id="fill"></div></div></div><script>
(()=>{'use strict';
const app=window.game.scope('New_ZZZF.BattleEquipment');
const root=document.getElementById('hint'),name=document.getElementById('name'),text=document.getElementById('text'),fill=document.getElementById('fill');
const clamp=v=>Math.max(0,Math.min(1,Number(v)||0));
function render(state){
  fill.style.transition='none';
  if(!state||!state.visible){root.classList.remove('show');fill.style.width='0%';return}
  root.classList.add('show');name.textContent=state.target||'';text.textContent=state.text||'';
  const initial=clamp(state.progress);
  fill.style.width=(initial*100)+'%';
  if(!state.holding)return;
  const duration=Math.max(1,Number(state.holdDurationMs)||750),remaining=duration*(1-initial);
  void fill.offsetWidth;
  fill.style.transition='width '+remaining+'ms linear';
  fill.style.width='100%';
}
const hydrate=()=>{try{const state=app.state.get('equipmentHint');if(state)render(state)}catch(_){}};
const requestCurrent=()=>{try{return app.request('getHint').then(render).catch(()=>{})}catch(_){return Promise.resolve()}};
const reportReady=()=>{try{if(window.game.surface&&typeof window.game.surface.ready==='function')window.game.surface.ready({component:'BattleEquipmentHint'}).catch(()=>{})}catch(_){}};
if(typeof app.state.watch==='function'){
  app.state.watch('equipmentHint',render);
  window.game.ready().then(reportReady).catch(()=>{});
}else{
  app.state.subscribe('equipmentHint',render);
  requestCurrent();
  if(window.game&&typeof window.game.ready==='function')window.game.ready().then(()=>{hydrate();requestCurrent()}).catch(()=>{hydrate();requestCurrent()});else hydrate();
}
})();
</script></body></html>
