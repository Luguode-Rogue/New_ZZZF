<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZZZF 技能配置</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0a0907;--panel:#15120e;--panel2:#1b1711;--panel3:#241d14;
  --line:rgba(211,174,92,.28);--line2:rgba(211,174,92,.48);
  --gold:#e8c36e;--gold2:#f5dda5;--text:#eadfce;--muted:#9b9185;
  --danger:#d77d63;--ok:#8baa7d;--blue:#829dbd;
  font-family:"Segoe UI","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--text)}
body{position:relative;user-select:none}
button,input,textarea{font:inherit}
button{border:1px solid var(--line);border-radius:7px;background:#19150f;color:var(--text);cursor:pointer}
button:hover{background:#2b2115;border-color:var(--line2)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
input,textarea{border:1px solid var(--line);border-radius:7px;background:#0b0907;color:var(--text);outline:none}
input:focus,textarea:focus{border-color:var(--gold)}
#capture{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:0}
#shell{position:absolute;inset:26px;z-index:1;display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:rgba(13,11,8,.985);box-shadow:0 26px 80px rgba(0,0,0,.7)}
#topbar{height:68px;flex:0 0 68px;display:flex;align-items:center;gap:14px;padding:0 18px;background:linear-gradient(180deg,#2b2418,#1c1710);border-bottom:1px solid var(--line)}
.title{font-size:22px;font-weight:700;letter-spacing:1px;color:var(--gold2)}
.subtitle{font-size:12px;color:var(--muted)}
.spacer{flex:1}.status{font-size:11px;color:var(--muted)}
.badge{padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#211a12;color:#d8bf84;font-size:11px}
#content{min-height:0;flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;min-height:0}.view.active{display:flex}
#mainView{gap:1px}
.side{width:270px;min-width:220px;background:#15110d;padding:14px;border-right:1px solid rgba(211,174,92,.16);display:flex;flex-direction:column;min-height:0}
.side.right{width:310px;min-width:250px;border-right:0;border-left:1px solid rgba(211,174,92,.16)}
.sideTitle{font-size:13px;color:#d8bf84;margin:0 0 10px;letter-spacing:.7px}.small{font-size:10px;color:var(--muted)}
.targetTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:7px}.targetTabs button{padding:7px 4px;font-size:11px}.targetTabs button.active{background:#604719;border-color:var(--gold);color:#fff1be}
#debugBtn{padding:7px 9px;margin-bottom:9px;font-size:10px}
.scroll{min-height:0;overflow:auto;scrollbar-width:thin}.targetItem{width:100%;text-align:left;padding:9px 10px;margin-bottom:6px;min-height:54px}.targetItem.active{background:#503a17;border-color:#e0b85e;box-shadow:inset 3px 0 #f0cd79}.targetName{font-weight:700;font-size:13px}.targetMeta{font-size:10px;color:#887e73;margin-top:4px}
#mainCenter{flex:1;min-width:0;background:#13100b;padding:14px;display:flex;flex-direction:column;min-height:0}
.centerHead{display:flex;align-items:center;gap:10px;margin-bottom:10px}.centerHead h2{font-size:17px;color:var(--gold2);margin:0}.hint{font-size:10px;color:var(--muted)}
#slotGrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(126px,1fr);gap:9px;overflow:auto}
.slot{position:relative;padding:11px;text-align:left;display:flex;flex-direction:column;min-width:0}.slot.active{background:#382914;border-color:#efc96d;box-shadow:0 0 0 1px #8b6a2b inset}.slotLabel{font-size:10px;color:#c6a35c}.slotName{margin-top:14px;font-size:15px;font-weight:700;line-height:1.25}.slotEmpty{margin-top:26px;color:#6e665e;font-size:12px}.slotMeta{margin-top:auto;display:flex;gap:10px;color:var(--blue);font-size:10px}.slotClear{position:absolute;right:7px;top:7px;width:24px;height:24px;border-radius:50%;font-size:11px;color:#a79278}
#rightCurrent{padding:12px;border:1px solid var(--line);border-radius:9px;background:#1b160f;margin-bottom:12px}.label{font-size:10px;color:var(--muted)}.value{margin-top:4px;font-size:16px;font-weight:700;color:#efd79f}
.prof{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.045);font-size:11px}.profName{flex:1;color:#bdb2a4}.profValue{color:#d7bd7c;font-weight:700}
#proficiencies{flex:1 1 0;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
#footer{height:62px;flex:0 0 62px;display:flex;align-items:center;gap:9px;padding:0 14px;background:linear-gradient(180deg,#241e15,#19140e);border-top:1px solid var(--line)}
#footer .leftHint{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.footerBtns{margin-left:auto;display:flex;gap:6px}.footerBtns button{padding:8px 12px}.danger{border-color:rgba(215,125,99,.38)}.primary{background:#61491b;border-color:#dcb35b;color:#fff0bb}
#catalogView{background:#100d09;flex-direction:column;padding:16px;gap:10px}
.catalogBar{height:46px;flex:0 0 46px;display:flex;gap:8px;align-items:center}.catalogTitle{font-size:18px;color:var(--gold2);font-weight:700;min-width:200px}.catalogMeta{font-size:10px;color:var(--muted)}.catalogBar input{flex:1;min-width:180px;height:36px;padding:0 11px}.catalogBack{padding:8px 12px}.catalogGrid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(150px,auto);gap:9px;padding-right:2px}
.skillCard{display:flex;flex-direction:column;text-align:left;padding:11px;min-width:0}.skillTop{display:flex;align-items:flex-start;gap:8px}.skillIcon{width:42px;height:42px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;background:#0b0907;color:#d7b967;font-size:11px;font-weight:700;flex:0 0 42px}.skillName{font-size:14px;font-weight:700;line-height:1.25}.skillType{font-size:10px;color:#cfab63;margin-top:3px}.skillDesc{margin-top:9px;color:#a49a8d;font-size:10px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.skillFoot{margin-top:auto;padding-top:8px;display:flex;gap:10px;color:var(--blue);font-size:9px}.diffs{margin-top:6px;color:#a99b83;font-size:9px}.skillCard.selected{border-color:#efc96d;box-shadow:0 0 0 1px #8b6a2b inset;background:#2f2415}
#forgeView{background:#100d09;flex-direction:column;padding:14px;gap:10px}
.forgeTop{height:48px;flex:0 0 48px;display:flex;align-items:center;gap:9px}.forgeTop h2{margin:0;font-size:18px;color:var(--gold2)}.forgeName{width:260px;height:34px;padding:0 10px}.forgeMessage{flex:1;font-size:10px;color:#b19c79;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.forgeColumns{flex:1;min-height:0;display:grid;grid-template-columns:1.05fr 1fr 1.05fr;gap:9px}.forgePanel{min-height:0;display:flex;flex-direction:column;background:#14100c;border:1px solid rgba(211,174,92,.18);border-radius:9px;overflow:hidden}.forgePanelHead{padding:9px 11px;background:#1d1710;border-bottom:1px solid rgba(211,174,92,.14);font-size:12px;color:#d8bf84}.forgeList{min-height:0;overflow:auto;padding:7px}.forgeEntry{width:100%;text-align:left;padding:8px 9px;margin-bottom:5px}.forgeEntry .en{font-size:11px;font-weight:700}.forgeEntry .ed{margin-top:3px;font-size:9px;color:#8f877c;line-height:1.35}.buildEntry{display:flex;gap:7px;align-items:center}.buildEntry .remove{width:26px;height:26px;flex:0 0 26px}.forgeBottom{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:7px}.forgeBottom textarea{height:42px;flex:1;resize:none;padding:7px 10px}.forgeBottom button{padding:8px 12px}.forgeRightActions{display:flex;gap:5px}.forgeEmpty{color:#70685e;font-size:11px;padding:14px;text-align:center}
@media(max-width:1200px){#shell{inset:14px}.side{width:220px}.side.right{width:250px}.catalogGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.slotName{font-size:13px}}
@media(max-width:900px){.side{width:190px}.side.right{display:none}.catalogGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.slotGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
button:disabled{opacity:.4;cursor:default}select{background:#17120d;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px;min-width:0;font:inherit}
#targetHelp{line-height:1.5;margin-bottom:9px;min-height:30px}#targetSearch{width:100%;padding:8px;margin-bottom:7px;flex-shrink:0}.targetFilters{display:flex;gap:5px;margin-bottom:6px}.targetFilters select{width:50%;font-size:11px}.targetSummary,.targetPages{display:flex;align-items:center;justify-content:space-between;gap:5px;font-size:10px;color:var(--muted);flex-shrink:0}.targetSummary{margin-bottom:8px}.targetSummary button{font-size:10px;padding:4px}.targetPages{padding-top:8px}.targetPages button{font-size:10px;padding:6px}.targetId{font-size:9px;color:#a18e6c;margin-top:4px;overflow-wrap:anywhere}.targetEmpty{padding:16px 8px;color:var(--muted);line-height:1.6;font-size:11px}
.filterDropdown{position:relative;width:50%;min-width:0;flex-shrink:0}.filterDropdown[hidden],.filterMenu[hidden]{display:none}.filterToggle{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;padding:8px;font-size:11px;text-align:left}.filterToggle::after{content:'▾';flex-shrink:0}.filterToggle[aria-expanded="true"]{border-color:var(--gold)}.filterMenu{position:absolute;top:calc(100% + 4px);left:0;min-width:100%;max-width:280px;max-height:240px;overflow:auto;overscroll-behavior:contain;z-index:50;padding:4px;background:#211a10;border:1px solid var(--gold);border-radius:7px;box-shadow:0 8px 20px #0009}.filterOption{display:block;width:100%;border:0;border-radius:4px;padding:8px;text-align:left;font-size:11px;white-space:nowrap}.filterOption:hover,.filterOption:focus{background:#503a17;outline:1px solid var(--gold)}.filterOption[aria-selected="true"]{color:var(--gold2);background:#382914}
</style>
</head>
<body>
<div id="capture"></div>
<div id="shell">
  <header id="topbar"><div class="title">技能配置</div><div class="subtitle" id="subtitle">技能系统</div><div class="spacer"></div><div class="badge" id="targetBadge">队伍成员</div><div class="status" id="status">初始化…</div></header>
  <main id="content">
    <section id="mainView" class="view active">
      <aside class="side"><div class="sideTitle">编辑目标</div><button id="debugBtn">调试模式：关</button><div class="targetTabs" role="tablist" aria-label="目标分类"><button role="tab" data-type="0">队伍</button><button role="tab" data-type="1">兵种</button><button role="tab" data-type="2">领主</button></div><div id="targetHelp" class="hint"></div><input id="targetSearch" placeholder="搜索名称或 ID…" autocomplete="off" aria-label="搜索目标" /><div class="targetFilters"><div id="targetCulture" class="filterDropdown"><button type="button" class="filterToggle" aria-label="文化" aria-haspopup="listbox" aria-expanded="false" aria-controls="cultureOptions">全部文化</button><div id="cultureOptions" class="filterMenu" role="listbox" aria-label="文化" hidden></div></div><div id="targetTier" class="filterDropdown"><button type="button" class="filterToggle" aria-label="阶级" aria-haspopup="listbox" aria-expanded="false" aria-controls="tierOptions">全部阶级</button><div id="tierOptions" class="filterMenu" role="listbox" aria-label="阶级" hidden></div></div></div><div class="targetSummary"><span id="targetCount"></span><button id="targetReset">重置筛选</button></div><div class="scroll" id="heroList"></div><div class="targetPages"><button id="targetPrev">上一页</button><span id="targetPage"></span><button id="targetNext">下一页</button></div></aside>
      <section id="mainCenter"><div class="centerHead"><h2>技能槽位</h2><div class="hint">点击槽位进入技能目录 · 每个槽位都有独立类型过滤</div><div class="spacer"></div><button id="forgeBtn" class="primary">法术锻造</button></div><div id="slotGrid"></div></section>
      <aside class="side right"><div class="sideTitle">当前目标</div><div id="rightCurrent"><div class="label">角色 / 模板</div><div class="value" id="currentName">—</div><div class="label" style="margin-top:10px">正在编辑</div><div class="value" id="activeSlot">—</div><div class="label" style="margin-top:10px">修改状态</div><div class="value" id="dirty">已保存</div></div><div class="sideTitle">原生技能熟练度</div><div class="scroll" id="proficiencies"></div></aside>
    </section>
    <section id="catalogView" class="view"><div class="catalogBar"><button id="catalogBack" class="catalogBack">← 返回</button><div class="catalogTitle">选择技能</div><div class="catalogMeta" id="catalogMeta">—</div><div class="spacer"></div><input id="catalogSearch" placeholder="搜索名称、描述、ID…" autocomplete="off" /></div><div class="catalogGrid" id="catalogGrid"></div></section>
    <section id="forgeView" class="view"><div class="forgeTop"><button id="forgeBack">← 返回技能界面</button><h2>法术锻造</h2><input id="forgeName" class="forgeName" placeholder="法术名称" autocomplete="off" /><div class="forgeMessage" id="forgeMessage">—</div></div><div class="forgeColumns"><section class="forgePanel"><div class="forgePanelHead">素材库 · 节点 / 组件 / 官方法术 / 预设组合</div><div class="forgeList" id="forgeAvailable"></div></section><section class="forgePanel"><div class="forgePanelHead">当前构筑</div><div class="forgeList" id="forgeBuild"></div></section><section class="forgePanel"><div class="forgePanelHead">已注册 / 已合成法术</div><div class="forgeList" id="forgeSpells"></div></section></div><div class="forgeBottom"><textarea id="forgeDescription" readonly placeholder="构筑说明"></textarea><button id="forgeClear">清空</button><button id="forgeConfirm" class="primary">确认锻造并装备</button></div></section>
  </main>
  <footer id="footer"><div class="leftHint" id="footerHint">M 新版 · Shift+M 旧版 · ↑↓ 目标 · 1~8 技能槽 · Enter 确认 · Esc 返回/关闭</div><div class="footerBtns"><button id="undo">撤销</button><button id="export">导出</button><button id="apply" class="primary">应用</button><button id="close" class="danger">关闭</button></div></footer>
</div>
<script>
(() => {
'use strict';
const app=window.game.app; let state=null,catalogCursor=0,targetPage=0,targetType=-1,filteredHeroes=[]; const targetFilters=new Map(),pageSize=40; let heroSignature="";
const $=id=>document.getElementById(id);
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
const composingInputs=new WeakSet(),pendingInputValues=new Map(),renderedMarkup=new WeakMap(),inputCommits=new WeakMap();
function isTextEditor(el){return !!el&&(el.matches?.('input,textarea,select')||el.isContentEditable)}
function syncInput(id,value){
 const el=$(id),next=String(value??'');
 if(pendingInputValues.has(id)){
  if(pendingInputValues.get(id)!==next)return;
  pendingInputValues.delete(id);
 }
 // Never replace the editor buffer/caret or an unfinished IME composition with a state echo.
 if(document.activeElement===el||composingInputs.has(el))return;
 if(el.value!==next){el.value=next;const tracker=inputCommits.get(el);if(tracker)tracker.lastSent=next;}
}
function updateHtml(id,markup){
 const root=$(id);if(renderedMarkup.get(root)===markup)return;
 const focused=document.activeElement,owned=root.contains(focused);
 const identity=owned?[...focused.attributes].filter(a=>a.name.startsWith('data-')).map(a=>[a.name,a.value]):[];
 const top=root.scrollTop,left=root.scrollLeft;
 root.innerHTML=markup;renderedMarkup.set(root,markup);
 root.scrollTop=top;root.scrollLeft=left;
 if(identity.length){const next=[...root.querySelectorAll('button,[tabindex]')].find(el=>identity.every(([key,value])=>el.getAttribute(key)===value));next?.focus({preventScroll:true})}
}
function bindComposedInput(id,onCommit,remote=false){
 const el=$(id),tracker={lastSent:el.value};inputCommits.set(el,tracker);
 const commit=()=>{if(composingInputs.has(el)||el.value===tracker.lastSent)return;tracker.lastSent=el.value;if(remote)pendingInputValues.set(id,el.value);onCommit(el.value)};
 el.addEventListener('compositionstart',()=>composingInputs.add(el));
 el.addEventListener('compositionend',()=>{composingInputs.delete(el);commit()});
 el.addEventListener('input',e=>{if(!e.isComposing)commit()});
 el.addEventListener('blur',commit);
}
function call(name,payload={}){try{return Promise.resolve(app.call(name,payload,10000)).catch(e=>{console.error('[CustomSkill]',name,e);$('status').textContent='桥接错误';});}catch(e){console.error('[CustomSkill]',name,e);$('status').textContent='桥接错误';return Promise.reject(e);}}
let activeView=null;function setActiveView(view){if(activeView===view)return;const previous=activeView;activeView=view;if(previous==='catalogView')pendingInputValues.delete('catalogSearch');if(previous==='forgeView')pendingInputValues.delete('forgeName');closeFilterMenus();for(const id of ['mainView','catalogView','forgeView'])$(id).classList.toggle('active',id===view)}
function render(s){state=s||null;if(!state)return;$('targetBadge').textContent=state.targetTypeText||'—';$('currentName').textContent=state.currentHeroName||'—';$('activeSlot').textContent=state.activeSlot||'—';$('dirty').textContent=state.dirty?'● 未保存':'● 已保存';$('dirty').style.color=state.dirty?'#e2a84f':'#7f9d78';$('status').textContent=state.exportStatus||'已连接';$('debugBtn').textContent='调试模式：'+(state.debugMode?'开':'关');document.querySelectorAll('.targetTabs button').forEach(btn=>{const active=Number(btn.dataset.type)===Number(state.targetType);btn.classList.toggle('active',active);btn.setAttribute('aria-selected',String(active));btn.disabled=Number(btn.dataset.type)!==0&&!state.debugMode;btn.title=btn.disabled?'开启调试模式后可用':''});renderHeroes();renderSlots();renderProficiencies();renderCatalog();renderForge();if(state.view==='catalog')setActiveView('catalogView');else if(state.view==='forge')setActiveView('forgeView');else setActiveView('mainView')}
// Keep menus in the page: native select popups can lose focus in the game overlay.
function closeFilterMenus(){document.querySelectorAll('.filterDropdown').forEach(root=>{root.querySelector('.filterMenu').hidden=true;root.querySelector('.filterToggle').setAttribute('aria-expanded','false')})}
function setFilterOptions(id,options,value){
 const root=$(id),menu=root.querySelector('.filterMenu'),toggle=root.querySelector('.filterToggle');
 const signature=JSON.stringify(options);
 if(root.dataset.options!==signature){
  root.dataset.options=signature;
  menu.innerHTML=options.map(([key,label])=>`<button type="button" class="filterOption" role="option" data-value="${escapeHtml(key)}" aria-selected="false">${escapeHtml(label)}</button>`).join('');
 }
 root.value=value;
 const label=options.find(([key])=>key===value)?.[1]||options[0][1];
 if(toggle.textContent!==label)toggle.textContent=label;
 menu.querySelectorAll('.filterOption').forEach(option=>{const selected=option.dataset.value===value;if(option.getAttribute('aria-selected')!==String(selected))option.setAttribute('aria-selected',String(selected))});
}
function openFilterMenu(root,focusOption=false){
 const menu=root.querySelector('.filterMenu'),wasOpen=!menu.hidden;
 closeFilterMenus();if(wasOpen&&!focusOption)return;
 menu.hidden=false;root.querySelector('.filterToggle').setAttribute('aria-expanded','true');
 if(focusOption)(menu.querySelector('[aria-selected="true"]')||menu.querySelector('.filterOption'))?.focus();
}
function handleFilterKey(e){
 const root=e.target.closest?.('.filterDropdown');
 const open=document.querySelector('.filterToggle[aria-expanded="true"]');
 if(e.key==='Escape'&&open){e.preventDefault();e.stopPropagation();closeFilterMenus();open.focus();return true}
 if(!root)return false;
 if(e.key==='Tab'){closeFilterMenus();return true}
 if(!['ArrowDown','ArrowUp','Home','End','Enter',' '].includes(e.key))return true;
 e.preventDefault();e.stopPropagation();
 const menu=root.querySelector('.filterMenu');
 if(menu.hidden){openFilterMenu(root,true);return true}
 const options=[...menu.querySelectorAll('.filterOption')],index=options.indexOf(document.activeElement);
 if(e.key==='Enter'||e.key===' '){if(index>=0)options[index].click();else openFilterMenu(root,true);return true}
 const next=e.key==='Home'?0:e.key==='End'?options.length-1:clamp(index+(e.key==='ArrowDown'?1:-1),0,options.length-1);
 options[next]?.focus();return true;
}
function currentFilters(){if(!targetFilters.has(targetType))targetFilters.set(targetType,{search:'',culture:'',tier:'',page:0});return targetFilters.get(targetType)}
function renderHeroes(){
 const list=state.heroes||[],type=Number(state.targetType),changed=type!==targetType;
 if(changed){closeFilterMenus();targetType=type;const f=currentFilters();syncInput('targetSearch',f.search);targetPage=f.page;heroSignature=''}
 const f=currentFilters();
 const cultures=[...new Map(list.map(h=>[h.culture||'',h.cultureName||'无文化'])).entries()].sort((a,b)=>a[1].localeCompare(b[1]));
 const tiers=[...new Set(list.map(h=>h.tier).filter(t=>t>=0))].sort((a,b)=>a-b);
 if(f.culture&&!cultures.some(([id])=>id===f.culture))f.culture='';
 if(f.tier&&!tiers.some(t=>String(t)===f.tier))f.tier='';
 setFilterOptions('targetCulture',[['','全部文化'],...cultures.filter(([id])=>id)],f.culture);
 setFilterOptions('targetTier',[['','全部阶级'],...tiers.map(t=>[String(t),`T${t}`])],f.tier);
 $('targetTier').hidden=type!==1;$('targetCulture').style.width=type===1?'50%':'100%';
 $('targetHelp').textContent=type===1?'仅列出士兵、佣兵、匪徒与商队护卫。配置按兵种 ID 生效。':type===2?'仅列出玩家家族以外的存活成年活跃领主。':'玩家家族的成年活跃成员。兵种、领主需开启调试。';
 const terms=f.search.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
 filteredHeroes=list.filter(h=>terms.every(t=>`${h.name} ${h.id} ${h.subtitle}`.toLocaleLowerCase().includes(t))&&(!f.culture||h.culture===f.culture)&&(type!==1||!f.tier||String(h.tier)===f.tier));
 const pages=Math.max(1,Math.ceil(filteredHeroes.length/pageSize));targetPage=clamp(targetPage,0,pages-1);f.page=targetPage;
 const visible=filteredHeroes.slice(targetPage*pageSize,(targetPage+1)*pageSize);
 $('targetCount').textContent=`${filteredHeroes.length} / ${list.length} 个目标`;$('targetPage').textContent=`${targetPage+1} / ${pages}`;
 $('targetPrev').disabled=targetPage===0;$('targetNext').disabled=targetPage>=pages-1;
 const signature=JSON.stringify([type,state.debugMode,list.length,targetPage,visible.map(h=>[h.id,h.name,h.subtitle,h.selected])]);
 if(signature===heroSignature)return;heroSignature=signature;
 updateHtml('heroList',visible.length?visible.map(h=>`<button class="targetItem ${h.selected?'active':''}" data-id="${escapeHtml(h.id)}" aria-pressed="${!!h.selected}"><div class="targetName">${escapeHtml(h.name)}</div><div class="targetMeta">${escapeHtml(h.subtitle)}</div>${state.debugMode?`<div class="targetId">${escapeHtml(h.id)}</div>`:''}</button>`).join(''):`<div class="targetEmpty">${list.length?'没有匹配目标，请调整或重置筛选。':'此分类没有可设置的目标。'}</div>`);

 if(changed)$('heroList').scrollTop=0;
}
function updateTargetFilters(){const f=currentFilters();f.search=$('targetSearch').value;f.culture=$('targetCulture').value;f.tier=$('targetTier').value;targetPage=0;renderHeroes();$('heroList').scrollTop=0}
function moveTarget(delta){if(!filteredHeroes.length)return;const index=filteredHeroes.findIndex(h=>h.id===state.currentHeroId);const next=clamp(index<0?0:index+delta,0,filteredHeroes.length-1);targetPage=Math.floor(next/pageSize);renderHeroes();call('selectHero',{id:filteredHeroes[next].id,targetType:Number(state.targetType)})}
function renderSlots(){
 const slots=state.slots||[];
 updateHtml('slotGrid',slots.map(s=>`<div class="slot ${s.active?'active':''}" data-index="${s.index}"><div class="slotLabel">${escapeHtml(s.label)}</div>${s.empty?'<div class="slotEmpty">— 空槽 —</div>':`<div class="slotName">${escapeHtml(s.skillName)}</div><div class="slotMeta"><span>冷却 ${escapeHtml(s.cooldown)}</span><span>消耗 ${escapeHtml(s.cost)}</span></div>`}${s.empty?'':`<button class="slotClear" title="清空槽位" data-clear="${s.index}">×</button>`}</div>`).join(''));
}
function renderProficiencies(){updateHtml('proficiencies',(state.proficiencies||[]).map(p=>`<div class="prof"><span class="profName">${escapeHtml(p.name)}</span><span class="profValue">${escapeHtml(p.text)}</span></div>`).join(''))}
function renderCatalog(){
 if(state.view!=='catalog')return;
 const list=state.catalog||[];catalogCursor=clamp(catalogCursor,0,Math.max(0,list.length-1));
 syncInput('catalogSearch',state.catalogSearch);$('catalogMeta').textContent=`${state.activeSlot||'槽位'} · ${list.length} 项`;
 updateHtml('catalogGrid',list.length?list.map(s=>{
  const diff=(s.difficulties||[]).map(d=>`${escapeHtml(d.attribute)} ${d.difficulty}`).join(' · ');
  return `<button class="skillCard" data-skill="${escapeHtml(s.id)}"><div class="skillTop"><div class="skillIcon">${escapeHtml((s.type||'?').slice(0,2))}</div><div><div class="skillName">${escapeHtml(s.name)}</div><div class="skillType">${escapeHtml(s.type)}</div></div></div><div class="skillDesc">${escapeHtml(s.description)}</div>${diff?`<div class="diffs">难度：${diff}</div>`:''}<div class="skillFoot"><span>冷却 ${Number(s.cooldown||0).toFixed(1)}s</span><span>消耗 ${Number(s.cost||0).toFixed(0)}</span></div></button>`;
 }).join(''):'<div class="small">没有符合当前槽位类型的技能</div>');
 highlightCatalog(false);
}
function highlightCatalog(scroll=true){$('catalogGrid').querySelectorAll('.skillCard').forEach((el,i)=>el.classList.toggle('selected',i===catalogCursor));if(scroll)$('catalogGrid').querySelectorAll('.skillCard')[catalogCursor]?.scrollIntoView({block:'nearest',inline:'nearest'})}
function renderForge(){
 if(state.view!=='forge'||!state.forge)return;
 const f=state.forge;syncInput('forgeName',f.newSpellName);syncInput('forgeDescription',f.buildDescription);
 $('forgeMessage').textContent=f.validationMessage||'从左侧加入节点、组件或子法术。';
 const available=f.availableNodes||[];
 updateHtml('forgeAvailable',available.length?available.map(x=>`<button class="forgeEntry" data-forge-add="${escapeHtml(x.id)}"><div class="en">${escapeHtml(x.name)}</div><div class="ed">${escapeHtml(x.description)}</div></button>`).join(''):'<div class="forgeEmpty">没有可用素材</div>');
 const build=f.currentBuild||[];
 updateHtml('forgeBuild',build.length?build.map(x=>`<div class="forgeEntry buildEntry"><button class="remove" data-forge-remove="${escapeHtml(x.id)}">×</button><div><div class="en">${escapeHtml(x.name)}</div><div class="ed">${escapeHtml(x.description)}</div></div></div>`).join(''):'<div class="forgeEmpty">尚未加入组件</div>');
 const spells=f.allSpells||[];
 updateHtml('forgeSpells',spells.length?spells.map(x=>`<div class="forgeEntry"><div class="en">${escapeHtml(x.name)}</div><div class="ed">${escapeHtml(x.description)}</div><div class="forgeRightActions" style="margin-top:7px"><button data-forge-edit="${escapeHtml(x.id)}">编辑</button><button data-forge-equip="${escapeHtml(x.id)}">装备</button></div></div>`).join(''):'<div class="forgeEmpty">没有已注册法术</div>');
}
// Bind dynamic controls once on their stable containers; unchanged rendering must not add handlers.
$('heroList').addEventListener('click',e=>{const button=e.target.closest('.targetItem');if(button)call('selectHero',{id:button.dataset.id,targetType})});
$('slotGrid').addEventListener('click',e=>{const clear=e.target.closest('[data-clear]');if(clear){call('clearSlot',{index:Number(clear.dataset.clear)});return}const slot=e.target.closest('.slot');if(slot)call('selectSlot',{index:Number(slot.dataset.index)})});
$('catalogGrid').addEventListener('click',e=>{const card=e.target.closest('.skillCard');if(card)call('catalogSelect',{skillId:card.dataset.skill})});
$('catalogGrid').addEventListener('mouseover',e=>{const card=e.target.closest('.skillCard');if(!card||card.contains(e.relatedTarget))return;catalogCursor=[...$('catalogGrid').querySelectorAll('.skillCard')].indexOf(card);highlightCatalog(false)});
for(const [root,attribute,command] of [['forgeAvailable','data-forge-add','forgeAdd'],['forgeBuild','data-forge-remove','forgeRemove'],['forgeSpells','data-forge-edit','forgeEdit'],['forgeSpells','data-forge-equip','forgeEquip']]){
 $(root).addEventListener('click',e=>{const button=e.target.closest(`[${attribute}]`);if(button)call(command,{id:button.getAttribute(attribute)})});
}
app.state.subscribe('customSkill',render);
bindComposedInput('targetSearch',updateTargetFilters);
document.querySelectorAll('.filterDropdown').forEach(root=>{
 root.querySelector('.filterToggle').addEventListener('click',()=>openFilterMenu(root));
 root.querySelector('.filterMenu').addEventListener('click',e=>{const option=e.target.closest('.filterOption');if(!option)return;root.value=option.dataset.value;closeFilterMenus();updateTargetFilters();root.querySelector('.filterToggle').focus()});
});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.filterDropdown'))closeFilterMenus()},true);
document.addEventListener('focusin',e=>{if(!e.target.closest('.filterDropdown'))closeFilterMenus()});
$('targetReset').addEventListener('click',()=>{targetFilters.set(targetType,{search:'',culture:'',tier:'',page:0});syncInput('targetSearch','');targetPage=0;renderHeroes();$('heroList').scrollTop=0});
$('targetPrev').addEventListener('click',()=>{targetPage--;renderHeroes();$('heroList').scrollTop=0});$('targetNext').addEventListener('click',()=>{targetPage++;renderHeroes();$('heroList').scrollTop=0});
$('proficiencies').addEventListener('wheel',e=>{e.preventDefault();e.stopPropagation();const direction=Math.sign(e.deltaY);if(!direction)return;const step=Math.max(36,Math.min(72,Math.abs(e.deltaY)*.5));$('proficiencies').scrollTop+=direction*step},{passive:false});
document.querySelectorAll('.targetTabs button').forEach(btn=>btn.addEventListener('click',()=>call('setTargetType',{value:Number(btn.dataset.type)})));$('debugBtn').addEventListener('click',()=>call('toggleDebug'));$('forgeBtn').addEventListener('click',()=>call('openForge'));$('catalogBack').addEventListener('click',()=>call('catalogBack'));$('forgeBack').addEventListener('click',()=>call('forgeBack'));$('undo').addEventListener('click',()=>call('undo'));$('apply').addEventListener('click',()=>call('apply'));$('export').addEventListener('click',()=>call('export'));$('close').addEventListener('click',()=>call('close'));$('forgeClear').addEventListener('click',()=>call('forgeClear'));$('forgeConfirm').addEventListener('click',()=>call('forgeConfirm'));bindComposedInput('catalogSearch',text=>{catalogCursor=0;call('searchCatalog',{text})},true);bindComposedInput('forgeName',value=>call('forgeSetName',{value}),true);
window.addEventListener('contextmenu',e=>e.preventDefault(),true);window.addEventListener('dragstart',e=>e.preventDefault(),true);window.addEventListener('selectstart',e=>{if(!e.target.closest('input,textarea'))e.preventDefault()},true);
window.addEventListener('keydown',e=>{const target=e.target;if(e.isComposing||e.keyCode===229||composingInputs.has(target))return;if(isTextEditor(target))return;if(handleFilterKey(e))return;if(e.key==='Escape'){e.preventDefault();e.stopPropagation();if(state?.view==='catalog')call('catalogBack');else if(state?.view==='forge')call('forgeBack');else call('close');return}if(!state)return;if(target.closest?.('button')&&(e.key==='Enter'||e.key===' '||e.key==='Tab'))return;const handled=['ArrowDown','ArrowUp','ArrowRight','ArrowLeft','Enter','F12','F8','Tab'].includes(e.key)||(e.key>='1'&&e.key<='8')||(e.ctrlKey&&['s','z','e'].includes(e.key.toLowerCase()));if(!handled)return;e.preventDefault();e.stopPropagation();if(state.view==='catalog'){const n=(state.catalog||[]).length;if(!n)return;if(e.key==='ArrowDown'){catalogCursor=(catalogCursor+1)%n;highlightCatalog()}else if(e.key==='ArrowUp'){catalogCursor=(catalogCursor-1+n)%n;highlightCatalog()}else if(e.key==='ArrowRight'){catalogCursor=Math.min(n-1,catalogCursor+4);highlightCatalog()}else if(e.key==='ArrowLeft'){catalogCursor=Math.max(0,catalogCursor-4);highlightCatalog()}else if(e.key==='Enter'){const item=(state.catalog||[])[catalogCursor];if(item)call('catalogSelect',{skillId:item.id})}else if(e.key>='1'&&e.key<='8'){call('catalogBack');call('selectSlot',{index:Number(e.key)-1})}return}if(state.view==='forge'){if(e.key==='Enter'&&e.ctrlKey)call('forgeConfirm');return}if(e.key==='ArrowDown')moveTarget(1);else if(e.key==='ArrowUp')moveTarget(-1);else if(e.key>='1'&&e.key<='8')call('selectSlot',{index:Number(e.key)-1});else if(e.key==='F12')call('toggleDebug');else if(e.key==='F8')call('openForge');else if(e.key==='Tab')call('setTargetType',{value:state.debugMode?((Number(state.targetType)+1)%3):0});else if(e.key.toLowerCase()==='s'&&e.ctrlKey)call('apply');else if(e.key.toLowerCase()==='z'&&e.ctrlKey)call('undo');else if(e.key.toLowerCase()==='e'&&e.ctrlKey)call('export')},true);
/* Never cancel pointerdown on the window: doing so suppresses WebView2's native click/focus chain. The overlay itself is already Captured, so Bannerlord does not receive these events. */
/* Native pointer events are intentionally allowed to reach the actual DOM target. */
(async()=>{try{const initial=await app.request('getState',{},10000);render(initial)}catch(e){console.error('[CustomSkill] initial state failed',e);$('status').textContent='初始状态读取失败'}})();
})();
</script>
